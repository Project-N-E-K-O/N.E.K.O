# Informational / optional gate. Driver compares against env NEKO_VERSION when set.
# "*" disables the check. Also: NEKO_TESTBENCH_COMPATIBLE_NEKO env overrides this.
compatible_neko = "*"

[plugin_runtime]
enabled = true
auto_start = false

# Dev: use repo tests/testbench instead of bundled/ when both exist.
# Also: NEKO_TESTBENCH_DEV_MODE=1
# dev_mode = false
