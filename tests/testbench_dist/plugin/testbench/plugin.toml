# N.E.K.O. Testbench driver plugin (FastAPI + prefer WebView window).
# Source lives under tests/testbench_dist/plugin/ — NOT plugin/plugins/.

[plugin]
id = "testbench"
name = "N.E.K.O. Testbench"
description = "AI 角色测试工作台。插件驱动独立 FastAPI；能力允许时优先打开独立 WebView 窗口。"
short_description = "Drive Testbench FastAPI; prefer standalone WebView window when possible."
keywords = ["testbench", "测试", "记忆", "评分", "prompt", "evaluation"]
version = "0.2.0"
type = "plugin"
passive = true
entry = "plugin.plugins.testbench:TestbenchDriverPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = false

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "Testbench"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = ["state:read", "action:call"]

[[plugin.ui.guide]]
id = "quickstart"
title = "快速开始"
entry = "docs/quickstart.md"
permissions = ["state:read"]
