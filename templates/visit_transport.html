<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N.E.K.O. visit transport</title>
    <style>
        html, body { background: transparent; margin: 0; overflow: hidden; width: 100%; height: 100%; }
        #visit-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: transparent; pointer-events: none; }
        /* 不能 display:none：requestVideoFrameCallback 依赖帧送到合成器 */
        #visit-video { position: absolute; left: 0; top: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }
    </style>
</head>
<body id="visit-transport-root">
    <video id="visit-video" muted playsinline></video>
    <canvas id="visit-canvas"></canvas>
    <script src="/static/visit/transport/transport.js?v={{ static_asset_version }}"></script>
    <script src="/static/visit/transport/pack.js?v={{ static_asset_version }}"></script>
    <script src="/static/visit/transport/unpack.js?v={{ static_asset_version }}"></script>
    <script src="/static/visit/transport/trtc-transport.js?v={{ static_asset_version }}"></script>
    <script src="/static/visit/transport/livekit-transport.js?v={{ static_asset_version }}"></script>
    <script src="/static/visit/transport/frame-sink.js?v={{ static_asset_version }}"></script>
    <script src="/static/visit/transport/backend-ws.js?v={{ static_asset_version }}"></script>
    <script src="/static/visit/transport/loader.js?v={{ static_asset_version }}"></script>
</body>
</html>
