<!doctype html>
<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="cookiesLogin.title">N.E.K.O 凭证管理中心</title>
    <link rel="icon" href="/static/icons/icon_systray.ico" type="image/x-icon">
    <script src="/static/libs/purify.js"></script>
    <script src="/static/i18n-i18next.js?v={{ static_asset_version | default('0') }}"></script>
    <script src="/static/theme-manager.js"></script>
    <link rel="stylesheet" href="/static/css/window_controls.css?v={{ static_asset_version | default('0') }}">
    <script src="/static/js/window_controls.js?v={{ static_asset_version | default('0') }}" defer=""></script>
    <style>
        :root {
            --bg: oklch(0.97 0.014 225);
            --bg-edge: oklch(0.92 0.05 215);
            --font-ui: "Segoe UI Variable Text", "PingFang SC", "Microsoft YaHei UI", "Noto Sans SC", sans-serif;
            --font-display: "Segoe UI Variable Display", "PingFang SC", "Microsoft YaHei UI", "Noto Sans SC", sans-serif;
            --font-mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
            --surface: oklch(0.995 0.006 225 / 0.46);
            --fg: oklch(0.22 0.035 255);
            --muted: oklch(0.55 0.03 250);
            --border: oklch(0.86 0.035 225 / 0.72);
            --accent: oklch(0.73 0.17 220);
            --accent-dim: oklch(0.57 0.15 225);
            --accent-soft: oklch(0.93 0.055 220 / 0.48);
            --accent-glow: oklch(0.73 0.17 220 / 0.2);
            --success: oklch(0.65 0.18 150);
            --surface-raised: oklch(0.995 0.006 225 / 0.54);
            --cat-ear-bg: oklch(0.72 0.16 220);
            --header-bg: oklch(0.985 0.01 225 / 0.48);
            --panel-shadow: 0 20px 55px rgba(26, 68, 96, 0.1);
        }

        *, *::before, *::after { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            font-family: var(--font-ui);
            font-kerning: normal;
            text-rendering: optimizeLegibility;
            -webkit-user-select: none;
            user-select: none;
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse at 82% 12%, oklch(0.84 0.11 215 / 0.28), transparent 40%),
                radial-gradient(ellipse at 10% 82%, oklch(0.78 0.1 225 / 0.16), transparent 36%),
                linear-gradient(112deg, color-mix(in oklch, var(--bg) 92%, white) 0%, var(--bg) 48%, var(--bg-edge) 100%);
            color: var(--fg);
            margin: 0; padding: 0;
            height: 100vh; height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        input,
        textarea {
            -webkit-user-select: text;
            user-select: text;
        }
        img {
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 52px 0 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.16;
            background-image: radial-gradient(circle, var(--accent) 0.8px, transparent 1px);
            background-size: 44px 44px;
            -webkit-mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 82%, transparent);
            mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 82%, transparent);
        }
        body::after {
            content: '';
            position: fixed;
            z-index: 0;
            top: 52px;
            right: -36px;
            bottom: 0;
            width: min(50vw, 620px);
            pointer-events: none;
            background: url('/static/default/card_faces/YUI.png') center 14% / cover no-repeat;
            opacity: 0.17;
            filter: saturate(0.72) contrast(0.94);
            -webkit-mask-image: radial-gradient(ellipse 78% 76% at 76% 38%, #000 0%, rgba(0, 0, 0, 0.78) 50%, transparent 100%);
            mask-image: radial-gradient(ellipse 78% 76% at 76% 38%, #000 0%, rgba(0, 0, 0, 0.78) 50%, transparent 100%);
        }

        /* ==============================
           HEADER — N.E.K.O. cat-ear bar
           ============================== */
        .app-header {
            background: var(--header-bg);
            border-bottom: 1px solid color-mix(in oklch, var(--border) 78%, transparent);
            box-shadow: 0 8px 30px rgba(12, 40, 62, 0.07);
            backdrop-filter: blur(18px) saturate(135%);
            -webkit-backdrop-filter: blur(18px) saturate(135%);
            padding: 0 20px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 100;
            position: relative;
            -webkit-app-region: drag;
        }
        .app-header::after,
        .app-header::before {
            content: '';
            position: absolute;
            z-index: 1;
            bottom: -3px;
            width: 42px;
            height: 3px;
            border: 0;
            background: var(--accent);
            transform: skewX(-34deg);
            opacity: 0.9;
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .app-header::after {
            left: 24px;
        }
        .app-header::before {
            left: 74px;
            width: 18px;
            opacity: 0.45;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid color-mix(in oklch, var(--accent) 72%, white);
            box-shadow: 0 0 16px var(--accent-glow);
            object-fit: cover;
            object-position: center 24%;
            flex-shrink: 0;
            -webkit-user-drag: none;
        }
        .header-greeting {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 15px;
            color: var(--fg);
            letter-spacing: -0.01em;
            line-height: 1.2;
        }
        .header-greeting small {
            font-weight: 400;
            font-size: 12px;
            opacity: 0.8;
            letter-spacing: 0.02em;
            display: block;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 0;
            -webkit-app-region: no-drag;
        }
        .header-right .neko-window-control-btn {
            color: var(--fg);
        }
        .header-right .neko-window-control-btn:hover {
            background: var(--accent-soft);
        }
        .header-right .close-page-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
        }
        .header-right .close-page-btn img {
            display: block;
            width: 32px;
            height: 32px;
        }

        /* ==============================
           SCROLLABLE CONTENT AREA
           ============================== */
        .console-main {
            flex: 1;
            min-height: 0;
            overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            touch-action: pan-y;
            scrollbar-gutter: stable;
            padding: 24px 24px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
        }
        .console-main > * { flex-shrink: 0; }
        body.neko-page-minimized {
            min-height: 0;
            overflow: hidden;
        }
        body.neko-page-minimized .console-main {
            display: none;
        }

        /* ==============================
           CHARACTER BANNER
           ============================== */
        .character-banner {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 820px;
            background: var(--surface-raised);
            border-radius: 18px;
            padding: 20px 24px;
            box-shadow: var(--panel-shadow);
            border: 1px solid var(--border);
            backdrop-filter: blur(18px) saturate(130%);
            -webkit-backdrop-filter: blur(18px) saturate(130%);
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }
        .character-banner::before {
            content: '';
            position: absolute;
            inset: 0 auto 0 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent), transparent 85%);
            box-shadow: 0 0 14px var(--accent-glow);
        }
        .character-banner::after {
            content: '';
            position: absolute;
            z-index: -1;
            width: 230px;
            height: 230px;
            top: -150px;
            right: -70px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow), transparent 68%);
        }
        .char-avatar-wrap {
            position: relative;
            isolation: isolate;
            flex-shrink: 0;
            width: 124px;
            height: 124px;
            padding: 0;
            border: 0;
            background: url('/static/default/card_faces/YUI.png') center 24% / cover;
            border-radius: 50%;
            box-shadow: 0 0 18px var(--accent-glow);
            color: var(--accent);
            cursor: pointer;
            appearance: none;
        }
        .char-avatar-wrap:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
        .char-avatar-wrap::after {
            content: '';
            position: absolute;
            z-index: 0;
            inset: 0;
            pointer-events: none;
            border: 3px solid color-mix(in oklch, var(--accent) 78%, white);
            border-radius: 50%;
            box-shadow:
                inset 0 0 0 1px color-mix(in oklch, white 45%, transparent),
                inset 0 0 12px var(--accent-glow);
        }
        .char-avatar {
            position: absolute;
            z-index: 1;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            clip-path: circle(50%);
            transform: scale(1.07);
        }
        .char-avatar-idle {
            opacity: 1;
        }
        .char-avatar-privacy {
            opacity: 0;
        }
        .char-avatar-angry {
            opacity: 0;
        }
        .char-avatar-theme-dark {
            display: none;
        }
        [data-theme="dark"] .char-avatar-theme-light {
            display: none;
        }
        [data-theme="dark"] .char-avatar-theme-dark {
            display: block;
        }
        .character-banner.credential-privacy-active .char-avatar-idle {
            opacity: 0;
        }
        .character-banner.credential-privacy-active .char-avatar-privacy {
            opacity: 1;
        }
        .character-banner.mascot-angry:not(.credential-privacy-active) .char-avatar-idle {
            opacity: 0;
        }
        .character-banner.mascot-angry:not(.credential-privacy-active) .char-avatar-angry {
            opacity: 1;
        }
        .char-status-dot {
            position: absolute;
            z-index: 4;
            bottom: 8px;
            right: 8px;
            width: 16px;
            height: 16px;
            background: var(--success);
            border: 3px solid var(--surface-raised);
            border-radius: 50%;
        }
        .mascot-effect {
            position: absolute;
            z-index: 6;
            pointer-events: none;
            opacity: 0;
        }
        .mascot-anger-mark {
            top: -9px;
            right: -8px;
            display: grid;
            width: 25px;
            height: 25px;
            place-items: center;
            border: 2px solid color-mix(in oklch, #ff6b62 76%, white);
            border-radius: 50% 50% 44% 50%;
            background: linear-gradient(145deg, #ff8278, #f44f58);
            box-shadow: 0 4px 12px rgba(244, 79, 88, 0.3);
            color: white;
            font: 850 17px/1 var(--font-ui);
            transform: rotate(8deg);
        }
        .mascot-anger-mark::after {
            content: '';
            position: absolute;
            left: 1px;
            bottom: -4px;
            width: 7px;
            height: 7px;
            border-left: 2px solid color-mix(in oklch, #ff6b62 76%, white);
            border-bottom: 2px solid color-mix(in oklch, #ff6b62 76%, white);
            background: #f44f58;
            transform: rotate(-34deg) skew(-8deg);
        }
        .mascot-steam {
            width: 15px;
            height: 9px;
            top: 24px;
            border: 2px solid color-mix(in oklch, white 82%, var(--accent));
            border-radius: 50%;
        }
        .mascot-steam-left { left: -13px; }
        .mascot-steam-right { right: -13px; }
        .mascot-stars {
            top: -8px;
            left: -16px;
            color: oklch(0.82 0.16 95);
            font: 700 22px/1 var(--font-ui);
            text-shadow: 0 0 12px color-mix(in oklch, currentColor 52%, transparent);
        }
        .mascot-question {
            top: -12px;
            right: -8px;
            color: var(--accent);
            font: 800 28px/1 var(--font-display);
            text-shadow: 0 0 12px var(--accent-glow);
        }
        .character-banner.mascot-angry .mascot-anger-mark,
        .character-banner.mascot-angry .mascot-steam,
        .character-banner.mascot-success .mascot-stars,
        .character-banner.mascot-failure .mascot-question,
        .character-banner.mascot-curious .mascot-question {
            opacity: 1;
            animation: mascotEffectPop 0.56s ease-out both;
        }
        .character-banner.mascot-angry .mascot-steam {
            animation-name: mascotSteam;
        }
        .character-banner.mascot-curious .char-avatar:not(.char-avatar-privacy) {
            animation: mascotCurious 0.48s ease-in-out;
        }
        .mascot-bubble {
            position: absolute;
            z-index: 7;
            top: 12px;
            left: 138px;
            max-width: 180px;
            padding: 7px 11px;
            border: 1px solid color-mix(in oklch, var(--accent) 42%, var(--border));
            border-radius: 12px 12px 12px 4px;
            background: var(--surface-raised);
            box-shadow: 0 8px 22px var(--accent-glow);
            backdrop-filter: blur(16px) saturate(135%);
            color: var(--fg);
            font-size: 12px;
            font-weight: 650;
            line-height: 1.35;
            opacity: 0;
            /* 这个气泡带 aria-live：只归零 opacity 的话它还留在无障碍树里，
               读屏用户会听到看不见的内容。visibility 才能把它移出播报。 */
            visibility: hidden;
            pointer-events: none;
        }
        .mascot-bubble.visible {
            opacity: 1;
            visibility: visible;
            animation: mascotEffectPop 0.32s ease-out both;
        }
        .character-banner.credential-privacy-active .mascot-effect,
        .character-banner.credential-privacy-active .mascot-bubble {
            opacity: 0 !important;
            animation: none !important;
        }
        .character-banner.credential-privacy-active .mascot-bubble {
            visibility: hidden !important;
        }
        @keyframes mascotEffectPop {
            from { opacity: 0; transform: translateY(3px) scale(0.86); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes mascotSteam {
            from { opacity: 0; transform: translateY(5px) scale(0.72); }
            55% { opacity: 1; }
            to { opacity: 0; transform: translateY(-8px) scale(1.08); }
        }
        @keyframes mascotCurious {
            0%, 100% { transform: scale(1.07) rotate(0); }
            45% { transform: scale(1.07) rotate(-2deg); }
        }
        .char-speech {
            flex: 1;
            min-width: 0;
        }
        .char-speech h1 {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            color: var(--fg);
            margin: 0 0 2px;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }
        .char-speech p {
            margin: 0;
            font-size: 14px;
            color: var(--muted);
            line-height: 1.5;
            letter-spacing: 0;
        }
        .char-speech p .highlight {
            color: var(--accent);
            font-weight: 600;
        }

        /* ==============================
           PLATFORM TAB BAR
           ============================== */
        .platform-bar {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 4px 0;
        }
        .tab-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 11px;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .tab-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
            transform: translateY(-1px);
        }
        .tab-btn:active { transform: scale(0.95); }
        .tab-btn.active {
            background: linear-gradient(135deg,
                color-mix(in oklch, var(--accent) 82%, transparent),
                color-mix(in oklch, color-mix(in oklch, var(--accent) 72%, white) 82%, transparent));
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 7px 20px var(--accent-glow), inset 0 1px rgba(255,255,255,0.32);
        }

        /* ==============================
           CONTENT CARD
           ============================== */
        .content-card {
            width: 100%;
            max-width: 820px;
            background: var(--surface-raised);
            border-radius: 18px;
            box-shadow: var(--panel-shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            animation: cardIn 0.35s ease-out;
            backdrop-filter: blur(20px) saturate(130%);
            -webkit-backdrop-filter: blur(20px) saturate(130%);
        }
        .tab-content {
            height: 620px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px 28px;
            overscroll-behavior-y: auto;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes tabSlideFromRight {
            from { opacity: 0.35; transform: translateX(24px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes tabSlideFromLeft {
            from { opacity: 0.35; transform: translateX(-24px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .tab-slide-from-right .tab-content {
            animation: tabSlideFromRight 0.28s cubic-bezier(0.2, 0.75, 0.25, 1);
        }
        .tab-slide-from-left .tab-content {
            animation: tabSlideFromLeft 0.28s cubic-bezier(0.2, 0.75, 0.25, 1);
        }
        @media (prefers-reduced-motion: reduce) {
            .content-card { animation: none; }
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
            #QRLogin { transition: none; }
            .tab-slide-from-right .tab-content,
            .tab-slide-from-left .tab-content { animation: none; }
        }

        /* ==============================
           TUTORIAL BANNER
           ============================== */
        .tutorial-link {
            background: linear-gradient(135deg, var(--accent-soft), color-mix(in oklch, var(--surface) 86%, transparent));
            border: 1px solid color-mix(in oklch, var(--accent) 30%, var(--border));
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--accent-dim);
            text-decoration: none;
            box-shadow: 0 6px 18px color-mix(in oklch, var(--accent-glow) 28%, transparent);
            transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }
        .tutorial-link::before {
            content: '';
            position: absolute;
            inset: 0 28% auto 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), transparent);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .tutorial-link:hover {
            border-color: color-mix(in oklch, var(--accent) 82%, var(--border));
            background: linear-gradient(135deg, color-mix(in oklch, var(--accent-soft) 72%, var(--accent)), color-mix(in oklch, var(--surface) 72%, var(--accent-soft)));
            color: var(--accent);
            box-shadow: inset 4px 0 0 var(--accent), 0 0 0 2px var(--accent-glow), 0 12px 26px color-mix(in oklch, var(--accent) 22%, transparent);
            transform: translateY(-2px);
        }
        .tutorial-link:focus-visible {
            outline: none;
            border-color: var(--accent);
            background: linear-gradient(135deg, color-mix(in oklch, var(--accent-soft) 68%, var(--accent)), color-mix(in oklch, var(--surface) 70%, var(--accent-soft)));
            color: var(--accent);
            box-shadow: inset 4px 0 0 var(--accent), 0 0 0 3px var(--accent-glow), 0 12px 26px color-mix(in oklch, var(--accent) 22%, transparent);
        }
        .tutorial-link:active {
            border-color: var(--accent);
            box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 48%, transparent), 0 0 0 3px var(--accent-glow);
            transform: translateY(0) scale(0.985);
        }
        .tutorial-link-icon {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            color: white;
            background: linear-gradient(145deg, var(--accent), var(--accent-dim));
            box-shadow: 0 7px 18px var(--accent-glow);
            transition: box-shadow 0.18s ease, transform 0.18s ease;
        }
        .tutorial-link-copy {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .tutorial-title {
            font-size: 13px;
            font-weight: 600;
            color: currentColor;
        }
        .tutorial-link-subtitle {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
        }
        .tutorial-link-arrow {
            margin-left: auto;
            flex: 0 0 auto;
            font-size: 20px;
            line-height: 1;
            opacity: 0.72;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .tutorial-link:is(:hover, :focus-visible) .tutorial-link-icon {
            box-shadow: 0 8px 22px color-mix(in oklch, var(--accent) 42%, transparent);
            transform: scale(1.08);
        }
        .tutorial-link:is(:hover, :focus-visible) .tutorial-link-arrow {
            opacity: 1;
            transform: translate(3px, -3px) scale(1.08);
        }
        .twitch-auth-card {
            padding: 16px 18px;
            background: linear-gradient(135deg, var(--accent-soft), color-mix(in oklch, var(--surface) 86%, transparent));
            border: 1px solid color-mix(in oklch, var(--accent) 30%, var(--border));
            border-radius: 14px;
            color: var(--fg);
        }

        /* ==============================

        #status-area {

        }
        #status-area > summary {
            font-family: var(--font-display);
            font-size: 14px;

        .tutorial-link,

           RESPONSIVE
           ============================== */
        @media (max-width: 640px) {
            body::after { display: none; }
            .console-main { padding: 16px; gap: 16px; }

            .character-banner { padding: 16px 18px; border-radius: 16px; }
            .char-avatar-wrap { width: 104px; height: 104px; }
            .char-speech h1 { font-size: 17px; margin-bottom: 4px; }

           ============================== */

            --accent-dim: oklch(0.76 0.14 220);
            --accent-soft: oklch(0.24 0.055 230 / 0.46);
            --accent-glow: oklch(0.72 0.17 220 / 0.24);
            --cat-ear-bg: oklch(0.6 0.14 230);

        [data-theme="dark"] body,
        [data-theme="dark"] .console-main,
        [data-theme="dark"] * { scrollbar-color: rgba(255,255,255,0.15) rgba(0,0,0,0.3) !important; }

        @media (max-width: 640px) {
            [data-theme="dark"] .tab-btn { border-color: var(--border); background: var(--surface); }
            [data-theme="dark"] .tab-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
        }
    </style>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="app-header">
        <div class="header-left">
            <img class="header-avatar" src="/static/favicon.ico" alt="N.E.K.O." draggable="false">
            <div class="header-greeting" data-i18n="cookiesLogin.header">凭证管理中心</div>
        </div>
        <div class="header-right neko-window-controls">
            <button type="button" class="neko-window-control-btn header-pin" data-neko-window-control="pin" hidden data-i18n-title="common.pinWindow" data-i18n-aria="common.pinWindow" title="置顶窗口" aria-label="置顶窗口" aria-pressed="false">
                <span class="neko-window-pin-icon" aria-hidden="true"></span>
            </button>
            <button type="button" class="neko-window-control-btn" data-neko-window-control="minimize" data-i18n-title="common.minimize" data-i18n-aria="common.minimize" title="最小化" aria-label="最小化">
                <span class="neko-window-minimize-icon" aria-hidden="true"></span>
            </button>
            <button type="button" class="neko-window-control-btn" data-neko-window-control="maximize" data-i18n-title="common.maximize" data-i18n-aria="common.maximize" title="最大化" aria-label="最大化">
                <span class="neko-window-maximize-icon" aria-hidden="true"></span>
            </button>
            <button type="button" class="close-page-btn" data-neko-window-control="close" data-i18n-title="common.close" data-i18n-aria="common.close" title="关闭" aria-label="关闭">
                <img src="/static/icons/close_button.png" data-i18n-alt="common.close" alt="关闭" draggable="false">
            </button>
        </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="console-main">

        <!-- Character greeting banner -->
        <div class="character-banner">
            <button type="button" class="char-avatar-wrap" data-i18n-aria="cookiesLogin.mascotInteractionLabel" aria-label="与看板娘互动">
                <img class="char-avatar char-avatar-idle char-avatar-theme-light" src="/static/images/cookies/yui-credential-idle-light.webp" alt="" draggable="false">
                <img class="char-avatar char-avatar-privacy char-avatar-theme-light" src="/static/images/cookies/yui-credential-privacy-light.webp" alt="" draggable="false">
                <img class="char-avatar char-avatar-angry char-avatar-theme-light" src="/static/images/cookies/yui-credential-angry-light.webp" alt="" draggable="false">
                <img class="char-avatar char-avatar-idle char-avatar-theme-dark" src="/static/images/cookies/yui-credential-idle.webp" alt="" draggable="false">
                <img class="char-avatar char-avatar-privacy char-avatar-theme-dark" src="/static/images/cookies/yui-credential-privacy.webp" alt="" draggable="false">
                <img class="char-avatar char-avatar-angry char-avatar-theme-dark" src="/static/images/cookies/yui-credential-angry.webp" alt="" draggable="false">
                <span class="char-status-dot" aria-hidden="true"></span>
                <span class="mascot-effect mascot-anger-mark" aria-hidden="true">!</span>
                <span class="mascot-effect mascot-steam mascot-steam-left" aria-hidden="true"></span>
                <span class="mascot-effect mascot-steam mascot-steam-right" aria-hidden="true"></span>
                <span class="mascot-effect mascot-stars" aria-hidden="true">✦ ✧</span>
                <span class="mascot-effect mascot-question" aria-hidden="true">?</span>
            </button>
            <span class="mascot-bubble" aria-live="polite"></span>
            <div class="char-speech">
                <h1 data-i18n="cookiesLogin.header">凭证管理中心</h1>
                <p id="credential-hero-description">在各平台粘贴 <span class="highlight">Cookie</span> 并加密存储，供后续调用。</p>
            </div>
        </div>

        <!-- Platform tab bar (uses same class names as JS expects) -->
        <div class="platform-bar tabs" role="tablist">
            <button class="tab-btn active" onclick="switchTab('netease', this)" data-platform="netease" data-i18n="cookiesLogin.netease" role="tab" aria-controls="main-panel" aria-selected="true">网易云音乐</button>
            <button class="tab-btn" onclick="switchTab('bilibili', this)" data-platform="bilibili" data-i18n="cookiesLogin.bilibili" role="tab" aria-controls="main-panel" aria-selected="false">Bilibili</button>
            <button class="tab-btn" onclick="switchTab('xhh', this)" data-platform="xhh" data-i18n="cookiesLogin.xhh" role="tab" aria-controls="main-panel" aria-selected="false">小黑盒</button>
            <button class="tab-btn" onclick="switchTab('youtube', this)" data-platform="youtube" data-i18n="cookiesLogin.youtube" role="tab" aria-controls="main-panel" aria-selected="false">YouTube</button>
            <button class="tab-btn" onclick="switchTab('twitch', this)" data-platform="twitch" data-i18n="cookiesLogin.twitch" role="tab" aria-controls="main-panel" aria-selected="false">Twitch</button>
            <button class="tab-btn" onclick="switchTab('douyin', this)" data-platform="douyin" data-i18n="cookiesLogin.douyin" role="tab" aria-controls="main-panel" aria-selected="false">抖音</button>
            <button class="tab-btn" onclick="switchTab('kuaishou', this)" data-platform="kuaishou" data-i18n="cookiesLogin.kuaishou" role="tab" aria-controls="main-panel" aria-selected="false">快手</button>
            <button class="tab-btn" onclick="switchTab('weibo', this)" data-platform="weibo" data-i18n="cookiesLogin.weibo" role="tab" aria-controls="main-panel" aria-selected="false">微博</button>
            <button class="tab-btn" onclick="switchTab('twitter', this)" data-platform="twitter" data-i18n="cookiesLogin.twitter" role="tab" aria-controls="main-panel" aria-selected="false">Twitter/X</button>
            <button class="tab-btn" onclick="switchTab('reddit', this)" data-platform="reddit" data-i18n="cookiesLogin.reddit" role="tab" aria-controls="main-panel" aria-selected="false">Reddit</button>
        </div>

        <!-- Main content card -->
        <div class="content-card">

            <div class="tab-content" id="main-panel" role="tabpanel" tabindex="0">

                <!-- Tutorial entry -->
                <a class="tutorial-link" href="/api/auth/guide" target="neko_credential_guide" onclick="return openCredentialGuide(event)">
                    <span class="tutorial-link-icon" aria-hidden="true">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path>
                        </svg>
                    </span>
                    <span class="tutorial-link-copy">
                        <span class="tutorial-title" data-i18n="cookiesLogin.guide.title">新手通用获取教程</span>
                        <span class="tutorial-link-subtitle" data-i18n="cookiesLogin.guide.open">打开独立教程页面</span>
                    </span>
                    <span class="tutorial-link-arrow" aria-hidden="true">↗</span>
                </a>

                <div id="panel-desc"></div>
                <div id="QRLogin"></div>
                <div id="dynamic-fields"></div>

                <!-- Encrypt toggle -->
                <div class="encrypt-row">
                    <input type="checkbox" id="encrypt-toggle" checked="">
                    <label for="encrypt-toggle" data-i18n="cookiesLogin.encryptStorage">安全加密存储至本地文件</label>
                </div>

                <div class="submit-row">
                    <div id="main-alert" class="alert"></div>
                    <button class="submit-btn" id="submit-btn" onclick="submitCurrentCookie()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
                        </svg>
                        <span id="submit-text" data-i18n="cookiesLogin.saveConfig">保存配置</span>
                    </button>
                </div>
            </div>

            <!-- Status monitoring -->
            <details id="status-area">
                <summary><span data-i18n="cookiesLogin.localMonitoring">本地状态监控</span></summary>
                <div id="platform-list-content" data-empty-text="还没有保存的凭证呢，选个平台开始添加吧"></div>
            </details>

        </div>
    </main>

    <dialog id="credential-confirm-dialog" class="credential-confirm-dialog" aria-labelledby="credential-confirm-title" aria-describedby="credential-confirm-message">
        <div class="credential-confirm-body">
            <h2 id="credential-confirm-title" class="credential-confirm-heading">
                <span class="credential-confirm-icon" aria-hidden="true">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v5M14 11v5"></path>
                    </svg>
                </span>
                <span data-confirm-title></span>
            </h2>
            <p id="credential-confirm-message" class="credential-confirm-message"></p>
        </div>
        <div class="credential-confirm-actions">
            <button type="button" class="credential-confirm-btn" data-confirm-cancel></button>
            <button type="button" class="credential-confirm-btn danger" data-confirm-accept></button>
        </div>
    </dialog>

    <script src="/static/js/cookies_login.js?v={{ static_asset_version | default('0') }}"></script>

    <script>
    (function(){
      var platformIcons = {
        'netease': '<svg viewBox="0 0 24 24" fill="none" stroke="#D43C33" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M15 9l-5 4 5 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9v6" stroke-linecap="round"/></svg>',
        'bilibili': '<svg viewBox="0 0 24 24" fill="none" stroke="#00A1D6" stroke-width="1.5"><rect x="4" y="6" width="16" height="13" rx="2"/><path d="M9 3l2 3h2l2-3" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 12l2 2 4-3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        'xhh': '<svg viewBox="0 0 24 24" fill="none" stroke="#5E8B3C" stroke-width="1.5"><path d="M4 20V7l8-5 8 5v13H4z" stroke-linejoin="round"/><path d="M12 7v6" stroke-linecap="round"/><circle cx="12" cy="16" r="1" fill="#5E8B3C"/></svg>',
        'youtube': '<svg viewBox="0 0 24 24" fill="none" stroke="#FF0000" stroke-width="1.5"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 9l5 3-5 3V9z" fill="#FF0000"/></svg>',
        'twitch': '<svg viewBox="0 0 24 24" fill="none" stroke="#9146FF" stroke-width="1.5"><path d="M5 3h14v10l-4 4h-4l-3 3v-3H5V3z" stroke-linejoin="round"/><path d="M14 8v4M10 8v4" stroke-linecap="round"/></svg>',
        'douyin': '<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.5"><path d="M15 5v9a4 4 0 01-4 4h0a4 4 0 01-4-4" stroke-linecap="round"/><path d="M15 5h0a3 3 0 003 3V5" stroke-linecap="round"/><circle cx="9" cy="14" r="1.5" fill="#000"/><path d="M19 11a8 8 0 01-8 8" stroke-linecap="round" stroke-dasharray="2 3"/></svg>',
        'kuaishou': '<svg viewBox="0 0 24 24" fill="none" stroke="#FF6900" stroke-width="1.5"><circle cx="12" cy="11" r="5"/><path d="M16 17l2 4" stroke-linecap="round"/><path d="M8 17l-2 4" stroke-linecap="round"/><path d="M12 6V3" stroke-linecap="round"/><path d="M9 7l1-2" stroke-linecap="round"/><path d="M15 7l-1-2" stroke-linecap="round"/></svg>',
        'weibo': '<svg viewBox="0 0 24 24" fill="none" stroke="#E6162D" stroke-width="1.5"><circle cx="11" cy="13" r="5"/><path d="M20 5c-1-2-4-3-7-1" stroke-linecap="round"/><path d="M4 14c-1 1-1 3 0 4" stroke-linecap="round"/><path d="M7 17c1 1 3 1 4 0" stroke-linecap="round"/></svg>',
        'twitter': '<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.5"><path d="M4 4l6 8-6 8h3l4-5 4 5h5l-6-8 6-8h-3l-4 5-4-5H4z" stroke-linejoin="round"/></svg>',
        'reddit': '<svg viewBox="0 0 24 24" fill="none" stroke="#FF4500" stroke-width="1.5"><circle cx="12" cy="14" r="6"/><path d="M8 22h8" stroke-linecap="round"/><path d="M12 20v2" stroke-linecap="round"/><circle cx="12" cy="6" r="2" fill="#FF4500"/><path d="M10 4L6 2" stroke-linecap="round"/><path d="M14 4l4-2" stroke-linecap="round"/></svg>'
      };
      function platKey(name) {
        var m = {
          '网易云音乐': 'netease', 'bilibili': 'bilibili', 'Bilibili': 'bilibili',
          '小黑盒': 'xhh', 'youtube': 'youtube', 'YouTube': 'youtube',
          'twitch': 'twitch', 'Twitch': 'twitch',
          '抖音': 'douyin', 'douyin': 'douyin',
          '快手': 'kuaishou', 'kuaishou': 'kuaishou',
          '微博': 'weibo', 'weibo': 'weibo',
          'twitter': 'twitter', 'Twitter': 'twitter', 'X': 'twitter',
          'reddit': 'reddit', 'Reddit': 'reddit'
        };
        return m[name] || null;
      }

      function injectStatusIcons() {
        var cards = document.querySelectorAll('.status-card');
        cards.forEach(function(card) {
          var info = card.querySelector('.status-info');
          if (!info || info.querySelector('.plat-icon')) return;
          var nameEl = card.querySelector('.status-name');
          if (!nameEl) return;
          var name = (nameEl.textContent || '').trim();
          var key = card.dataset.platform || platKey(name);
          if (!key) return;
          var svg = Object.prototype.hasOwnProperty.call(platformIcons, key)
            ? platformIcons[key]
            : null;
          if (!svg) return;
          var wrap = document.createElement('span');
          wrap.className = 'plat-icon';
          wrap.innerHTML = svg;
          info.insertBefore(wrap, info.firstChild);
        });
      }

      var _origSwitch = window.switchTab;
      if (_origSwitch) {
        window.switchTab = function(platform, el, isReRender) {
          var card = document.querySelector('.content-card');
          var tabs = Array.from(document.querySelectorAll('.tab-btn'));
          var currentIndex = tabs.findIndex(function(tab) {
            return tab.classList.contains('active');
          });
          var nextIndex = tabs.indexOf(el);

          if (card) {
            card.classList.remove('tab-slide-from-left', 'tab-slide-from-right');
          }

          _origSwitch(platform, el, isReRender);

          if (card && !isReRender && currentIndex !== nextIndex && currentIndex >= 0 && nextIndex >= 0) {
            void card.offsetWidth;
            card.classList.add(nextIndex > currentIndex ? 'tab-slide-from-right' : 'tab-slide-from-left');
          }
        };
      }

      var observer = new MutationObserver(function() {
        injectStatusIcons();
      });
      var list = document.getElementById('platform-list-content');
      if (list) {
        observer.observe(list, { childList: true, subtree: true });
      }

      if (document.readyState === 'complete') {
        injectStatusIcons();
      } else {
        window.addEventListener('load', function() {
          injectStatusIcons();
        });
      }

      setTimeout(injectStatusIcons, 500);
      setTimeout(injectStatusIcons, 1500);
    })();
    </script>

</body></html>
