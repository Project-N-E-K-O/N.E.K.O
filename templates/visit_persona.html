<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title data-i18n="visit.persona.windowTitle">串门自我介绍 - Project N.E.K.O.</title>
    <script>window.__NEKO_VISIT_PERSONA_STANDALONE__ = true;</script>
    <script src="/static/i18n-i18next.js?v={{ static_asset_version | default('0') }}"></script>
    <script src="/static/app/app-prompt-shared.js?v={{ static_asset_version | default('0') }}"></script>
    <link rel="stylesheet" href="/static/css/character_card_manager.css?v={{ static_asset_version | default('0') }}">
    <link rel="stylesheet" href="/static/css/window_controls.css?v={{ static_asset_version | default('0') }}">
    <link rel="stylesheet" href="/static/css/visit_persona_window.css?v={{ static_asset_version | default('0') }}">
    <link rel="stylesheet" href="/static/css/dark-mode.css?v={{ static_asset_version | default('0') }}">
    <script src="/static/theme-manager.js?v={{ static_asset_version | default('0') }}"></script>
    <script src="/static/js/window_controls.js?v={{ static_asset_version | default('0') }}" defer></script>
</head>
<body class="visit-persona-window-page">
    <header class="page-title-bar">
        <h2 data-i18n="visit.persona.windowTitle" data-text="串门自我介绍 - Project N.E.K.O.">串门自我介绍 - Project N.E.K.O.</h2>
        <div class="neko-window-controls">
            <button type="button" class="neko-window-control-btn" data-neko-window-control="pin" hidden
                    data-i18n-title="common.pinWindow" data-i18n-aria="common.pinWindow"
                    title="置顶窗口" aria-label="置顶窗口" aria-pressed="false">
                <span class="neko-window-pin-icon" aria-hidden="true"></span>
            </button>
            <button type="button" class="neko-window-control-btn" data-neko-window-control="minimize"
                    data-i18n-title="common.minimize" data-i18n-aria="common.minimize"
                    title="最小化" aria-label="最小化">
                <span class="neko-window-minimize-icon" aria-hidden="true"></span>
            </button>
            <button type="button" class="neko-window-control-btn" data-neko-window-control="maximize"
                    data-i18n-title="common.maximize" data-i18n-aria="common.maximize"
                    title="最大化" aria-label="最大化">
                <span class="neko-window-maximize-icon" aria-hidden="true"></span>
            </button>
            <button type="button" class="neko-window-control-btn" data-neko-window-control="close"
                    data-i18n-title="common.close" data-i18n-aria="common.close"
                    title="关闭" aria-label="关闭"></button>
        </div>
    </header>
    <main id="visit-persona-window-root" aria-live="polite"></main>
    <script src="/static/app/visit-persona-panel.js?v={{ static_asset_version | default('0') }}"></script>
</body>
</html>
