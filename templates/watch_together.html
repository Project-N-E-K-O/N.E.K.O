<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch together</title>
<style>
body{margin:0;background:#101725;color:#edf2ff;font:16px system-ui}main{max-width:1200px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between}button,select,input{font:inherit;padding:10px;border-radius:10px;border:1px solid #657597;background:#202c43;color:inherit}button{cursor:pointer}button:disabled{opacity:.5}video{width:100%;max-height:44vh;background:#05080e;border-radius:18px}#history{display:grid;gap:8px;margin:18px 0}#history button{text-align:left}#status{color:#a8bddf}#bubble{min-height:40px;padding:15px}details{margin:20px 0}#usage{white-space:pre-wrap}nav{display:flex;gap:10px;align-items:center}#events{display:flex;gap:8px;flex-wrap:wrap}a{color:#accfff}
.stage>section{display:flex;flex-direction:column}.stage nav{order:-1;margin-bottom:12px}.stage{display:grid;grid-template-columns:minmax(0,3fr) minmax(230px,1fr);gap:20px}#avatar{height:320px;min-width:230px;align-self:end}#history{max-height:320px;overflow:auto}#voice-label{color:#a8bddf;font-size:13px}@media(max-width:650px){.stage{grid-template-columns:1fr}#avatar{height:220px;grid-row:1}main{padding:14px}}
</style></head><body><main>
<header><h1 data-i18n="watchTogether.title">Watch together</h1><button id="exit" data-i18n="watchTogether.exit">Exit</button></header>
<p id="status" role="status"></p>
<form id="prepare"><input id="url" aria-label="Bilibili video URL" required placeholder="https://www.bilibili.com/video/BV…"><button id="prepare-button" data-i18n="watchTogether.prepare">Prepare video</button></form>
<form id="discover"><label><span data-i18n="watchTogether.topic">Topic (optional)</span> <input id="topic" maxlength="200"></label><button id="discover-button" data-i18n="watchTogether.discover">Let the companion choose</button></form>
<p data-i18n="watchTogether.discoveryRule">Under 3 minutes and over 100 danmaku/minute. Uses the current video topic when blank, or the popular feed if no video is selected.</p><p id="discovery-result" role="status"></p>
<section><label><input id="prefetch-enabled" type="checkbox" checked><span data-i18n="watchTogether.prefetchEnabled">Prepare the next video while watching</span></label><p id="next-status" role="status"></p><button id="next-video" disabled data-i18n="watchTogether.nextVideo">Watch next</button></section>
<details><summary data-i18n="watchTogether.analyses">Analysis history</summary><div id="history"></div></details>
<h2 id="title"></h2><p id="voice-label"></p><div class="stage"><section><video id="video" controls playsinline></video>
<div id="bubble" aria-live="polite"></div>
<nav><button id="play" disabled data-i18n="watchTogether.play">Watch together</button><label><span data-i18n="watchTogether.speed">Speed</span> <select id="rate"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select></label></nav>
</section><aside id="avatar"></aside></div>
<p id="warnings"></p><div id="events"></div>
<details><summary data-i18n="watchTogether.usage">API usage</summary><div id="usage"></div></details>
<details><summary data-i18n="watchTogether.watches">Actual viewing history</summary><div id="watches"></div></details>
</main>
<script src="/static/i18n-i18next.js"></script>
<script src="/static/game/sdk/neko-minigame-sdk.js"></script>
<script src="/static/libs/live2dcubismcore.min.js"></script>
<script src="/static/libs/live2d.min.js"></script>
<script src="/static/libs/pixi.min.js"></script>
<script src="/static/libs/index.min.js"></script>
<script src="/static/game/sdk/neko-minigame-avatar-host.js"></script>
<script type="importmap">{"imports":{"three":"/static/libs/three.module.js","three/addons/":"/static/libs/three/addons/","@pixiv/three-vrm":"/static/libs/three-vrm.module.min.js"}}</script>
<script id="neko-minigame-host-launch" type="application/json">{"registrations":{"watch-together":{"mode":"registered","gameId":"watch-together","publisherId":"project-neko","version":"1.0.0","allowedCapabilities":["logging","runtime","media-timeline","speech-output","voice-input","avatar-renderer"]}}}</script>
<script src="/static/game/sdk/neko-minigame-same-origin-bootstrap.js"></script>
<script type="module" src="/static/game/games/watch-together/host.mjs"></script>
</body></html>
