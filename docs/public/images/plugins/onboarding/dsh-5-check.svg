  <text x="32" y="212" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">$ uv run pytest plugin/plugins/water_reminder/tests</text>
  <text x="32" y="236" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">2 passed in 0.42s</text>

  <text x="32" y="274" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">$ uv run neko-plugin build water_reminder --out target/water_reminder.neko-plugin</text>
  <text x="32" y="298" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">[OK] Built package: target/water_reminder.neko-plugin</text>
