  <text x="28" y="26" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">dsh Tool Output — neko-plugin CLI Validation</text>

  <text x="32" y="76" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">$ uv run neko-plugin check water_reminder</text>
