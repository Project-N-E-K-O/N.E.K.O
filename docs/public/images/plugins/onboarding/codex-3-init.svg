<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" fill="none">
  <rect width="880" height="360" rx="14" fill="#0F172A"/>
  <rect x="1" y="1" width="878" height="358" rx="13" stroke="#334155" stroke-width="2"/>
  <rect x="1" y="1" width="878" height="40" rx="13" fill="#1E293B"/>
  <text x="28" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Codex Execution — Scaffolding via neko-plugin init</text>

  <text x="32" y="74" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">$ git clone --filter=blob:none https://github.com/Project-N-E-K-O/N.E.K.O.git</text>
  <text x="32" y="98" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">$ cd N.E.K.O &amp;&amp; uv sync &amp;&amp; uv run neko-plugin --help</text>
  <text x="32" y="128" fill="#F472B6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">$ uv run neko-plugin init water_reminder --type plugin --name "Water Reminder"</text>

  <rect x="32" y="148" width="816" height="182" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="52" y="176" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700">[OK] Created plugin scaffold: plugin/plugins/water_reminder/</text>
  <text x="52" y="204" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">├── .git/ &amp; .github/workflows/{verify.yml, release.yml}</text>
  <text x="52" y="228" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">├── plugin.toml          # id = "water_reminder", entry = "...:WaterReminderPlugin"</text>
  <text x="52" y="252" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">├── config.example.toml  # initial user config template</text>
  <text x="52" y="276" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">├── __init__.py          # @neko_plugin async entry class</text>
  <text x="52" y="300" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">└── tests/test_smoke.py  # ready-to-run pytest suite</text>
</svg>
