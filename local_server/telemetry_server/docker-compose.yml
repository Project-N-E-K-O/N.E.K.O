version: "3.8"

services:
  telemetry:
    build: .
    ports:
      - "8099:8099"
    volumes:
      - ./data:/app/data
    environment:
      # 存储中的业务时间戳固定为 +08:00，容器时区同样固定为 Asia/Shanghai。
      - TZ=Asia/Shanghai
      # Optional: admin auth token (used for export / queries / rebuild / denylist).
      # Disabled by default when unset/empty (admin endpoints return 503).
      # Set a strong random TELEMETRY_ADMIN_TOKEN in your .env file (or shell
      # environment) before starting if you need the admin API.
      - TELEMETRY_ADMIN_TOKEN=${TELEMETRY_ADMIN_TOKEN:-}
      # 可选：启用 /docs Swagger 页面
      # - TELEMETRY_ENABLE_DOCS=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
