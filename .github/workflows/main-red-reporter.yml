name: Main Red Reporter

# Turns a red test workflow on main into one tracking issue per workflow.
#
# The full unit suite runs only after merge (see unit-tests.yml), so a
# regression the PR's related tests missed shows up here first. For every
# completed push run of a watched workflow on main, scripts/ci/main_red_reporter.py:
#
# * failure: opens an issue labelled `main-red` (or comments on the open one)
#   with the failed jobs, the FAILED/ERROR lines from their logs, the run link
#   and every commit since the workflow last passed on main, mentioning the
#   PR authors as the suspect range — a queued run on main gets superseded,
#   so one failure can belong to any of several commits. When the full job's
#   `--lf` re-run passed, the issue also gets the `flaky` label.
# * success: comments on the open issue and closes it.
# * cancelled and everything else: ignored.
#
# It only reports. Nothing here fixes, reverts or re-runs anything.
#
# workflow_run only fires for workflow files on the default branch, so this
# cannot run before it is merged. workflow_dispatch replays any historical
# run; dry_run (the default) prints the issue it would write instead of
# writing it.
on:
  workflow_run:
    workflows: [Unit Tests, Unit Test Shards, Plugin Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run id to report on (from the run URL)
        required: true
        type: string
      dry_run:
        description: Only print what would be written
        required: false
        default: true
        type: boolean

permissions:
  issues: write
  actions: read
  # Read-only: checking out the reporter script and the compare API that
  # lists the suspect commits.
  contents: read

jobs:
  resolve:
    # The issue lock below is per watched workflow. A live event carries the
    # workflow id; a manual replay only has a run id, so look it up first —
    # otherwise a replay and a live report of the same workflow could each
    # see no open issue and open two.
    name: Resolve watched workflow
    if: >-
      github.repository == 'Project-N-E-K-O/N.E.K.O' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'success')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workflow_id: ${{ steps.resolve.outputs.workflow_id }}
    steps:
      - name: Look up the workflow of the run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          EVENT_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          case "$RUN_ID" in
            ''|*[!0-9]*) echo "::error::run_id must be a number, got '$RUN_ID'"; exit 1 ;;
          esac
          if [ -n "$EVENT_WORKFLOW_ID" ]; then
            workflow_id="$EVENT_WORKFLOW_ID"
          else
            workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.workflow_id')
          fi
          echo "workflow_id=$workflow_id" >> "$GITHUB_OUTPUT"

  report:
    name: Report main status
    needs: resolve
    concurrency:
      # One reporter at a time per watched workflow, live or replayed, so two
      # quick reports cannot both decide that no issue is open yet.
      group: main-red-reporter-${{ needs.resolve.outputs.workflow_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Default branch code, never the reported run's commit.
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Open, update or close the main-red issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_HEALTH_WEBHOOK_URL }}
        run: python scripts/ci/main_red_reporter.py
