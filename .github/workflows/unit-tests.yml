name: Unit Tests

# Repo-wide pytest gate for tests/unit.
#
# Until #2492 nothing in CI ran this directory: plugin-tests.yml covered
# plugin/tests plus two hand-listed root files, and everything else in
# tests/unit only ever ran when someone happened to run it locally. A PR could
# therefore add thousands of lines of tests that never executed in CI, and an
# existing test could go red for weeks without anyone noticing — both happened.
# #2454 shipped a crash that made every voice session fail on start while the
# suite guarding that file was green-by-omission, and the sweep that followed
# found 18 pre-existing failures on main, two of them real product bugs.
#
# Two layers, because the full suite outgrew the PR loop:
#
# * Full suite, after merge only. `Unit pytest (Windows)` runs every unmarked
#   file (~1470 files, ~57k tests): 28-32 minutes of pytest, ~41 minutes per
#   job. Nobody waited for it on a PR any more, so it was a gate in name only
#   and sat red on main unnoticed. It now runs on push to main and on demand.
#   When it fails, main-red-reporter.yml opens (or updates) a `main-red`
#   issue naming the failed tests and every commit since the last green run,
#   and a `--lf` re-run below tells a flaky failure from a real one.
#
# * Related tests, on every PR. scripts/ci/select_related_tests.py reads the
#   PR's diff (from the merge-base) and the repository's import graph — test
#   helpers included — and picks the unmarked test files that can reach a
#   changed file, plus tests that name a changed file literally. Global files
#   (pyproject.toml, uv.lock, pytest.ini, the root conftests, this workflow,
#   the selector itself) select everything. The selection is split into at
#   most four Windows shards of ~30% of the full suite each, so even a full
#   selection finishes in about 15 minutes. `Unit pytest (related)` is the
#   one stable check that summarises them; it always runs, also when nothing
#   was selected, so it can be a required check.
#
# Still no paths filter on purpose: the PR layer must report on every PR, and
# the selector — not a hand-written filter — decides what a change touches.
# Tests carrying a shard marker run in unit-test-shards.yml on every PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  # A new push to a PR supersedes the old related run; on main every run is
  # kept so the reporter can tell which commit turned it red.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-pytest:
    name: Unit pytest (Windows)
    # Full suite: push to main and manual runs only (see the header).
    if: github.event_name != 'pull_request'
    # windows-latest for the same reason as plugin-tests.yml: parts of the
    # suite exercise win32 paths, and Windows is the product's primary desktop
    # platform. It is also where the command-line length limit that silently
    # broke the cat-mind harness lives, so the guard against it stays honest.
    runs-on: windows-latest
    # The suite alone takes 28-32 minutes here and the job ~41; the `--lf`
    # re-run after a failure may add up to its own 15-minute cap. Nothing waits
    # on this job any more, so the ceiling only has to stop a hung run without
    # cutting a slow runner off in the middle of the re-run.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        # Plain `uv sync` = main deps + dev group. Deliberately no extras:
        # the galgame group (rapidocr + cv2, ~130 MB) is not needed — the OCR
        # teardown tests drive pure-Python paths and the rest self-skip. node
        # comes preinstalled on the runner image; the frontend harness suites
        # need it and fail loudly rather than silently skipping if it is gone.
        run: uv sync

      - name: Install pyclipper (in-tree rapidocr fork)
        # tests/unit/test_galgame_dependency_slimming.py exercises the in-tree
        # deps/rapidocr_pillow fork, whose det post-processing imports pyclipper
        # at module scope. It ships with the galgame group, but that group also
        # drags in opencv (~130 MB) which nothing else here needs. The wheel is
        # ~260 KB on its own, so install just that and keep the four fork tests
        # running instead of letting them skip in the one environment that
        # would otherwise never exercise them.
        #
        # Pinned to the version uv.lock already resolved for the galgame group,
        # so an index update cannot make an unchanged commit install a different
        # release and turn this workflow red (Greptile P2). uv.lock stays the
        # single source of truth: test_unit_tests_workflow_pins_locked_pyclipper
        # fails if this pin and the lock ever drift apart.
        run: uv pip install pyclipper==1.4.0

      - name: Install CAM++ frontend parity oracle
        # Test-only reference implementation. It is intentionally absent from
        # product dependencies; the unit gate installs a fixed version so the
        # CAM++ frontend parity test cannot silently importorskip in CI.
        run: uv pip install kaldi-native-fbank==1.22.3

      - name: Run unit test suite
        id: full-suite
        # Separate pytest process from plugin/tests, which carries its own
        # pytest.ini.
        #
        # Not built here: static/react/ is a gitignored vite output, so the one
        # assertion that reads the built bundle skips. build-desktop.yml
        # rebuilds and verifies that artifact on every run, which is the right
        # place for it — a stale local bundle would only produce a false green.
        #
        # `-n auto --dist loadfile`: 24000+ tests in one process took 19m11s
        # here, against a 25-minute job ceiling — close enough that a slow runner
        # turned the gate red for reasons that had nothing to do with the PR.
        # Parallel brings that to 14m32s. Less than the 3.6x a 20-core dev box
        # shows, because this runner has 4 vCPUs and every worker pays a full
        # app import plus a full collection before its first test: 4m33s of the
        # 14m32s is startup that the serial run did once.
        # loadfile (not the default `load`) keeps every test of a file together
        # on one worker in declaration order, so the seed pinned in pytest.ini
        # still reproduces and the process-global cleanup in
        # tests/unit/conftest.py still sees the same within-file sequence.
        # Cross-file order dependencies are what random-order-tests.yml hunts;
        # they were never something this job's fixed order guaranteed.
        # PR #3078 tests run in the dedicated shards below. Keeping them out of
        # this xdist gate prevents socket/process tests from being scheduled on
        # workers while preserving coverage of the remaining unit suite.
        # Keep fixtures outside the checkout: source scanners must not read
        # generated test files, and storage tests need paths outside the project.
        #
        # The related shards below must run with the same options and the same
        # -m expression; test_select_related_tests.py checks they agree.
        #
        # The JUnit report (xunit1, so every case names its file) is what the
        # PR selector balances its shards by; see the upload step below.
        run: uv run pytest tests/unit -q -n auto --dist loadfile --basetemp "${{ runner.temp }}/neko-unit-suite" -m "not unit_fast and not runtime and not integration_serial and not frontend_contract" --junitxml "${{ runner.temp }}/unit-junit/full.xml" -o junit_family=xunit1

      - name: Upload test durations for PR shard planning
        # Kept on failure too: a red run still measured every file it ran.
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: unit-durations
          path: ${{ runner.temp }}/unit-junit/full.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Re-run failed tests once (flaky check)
        # Runs only the tests the full run recorded as failed (`--lf` reads
        # .pytest_cache; files without failures are not even collected) and
        # `--lfnf none` keeps an empty record from re-running everything. The
        # job stays red either way: the verdict is for main-red-reporter.yml,
        # which reads the NEKO_LF_RERUN_RESULT line from this job's log and
        # labels the issue `flaky` when the re-run passed.
        if: failure() && steps.full-suite.outcome == 'failure'
        timeout-minutes: 15
        shell: pwsh
        run: |
          uv run pytest tests/unit -q -n 0 --lf --lfnf none --basetemp "${{ runner.temp }}/neko-unit-rerun" -m "not unit_fast and not runtime and not integration_serial and not frontend_contract"
          $rc = $LASTEXITCODE
          $verdict = if ($rc -eq 0) { 'passed' } else { 'failed' }
          Write-Host "NEKO_LF_RERUN_RESULT=$verdict (pytest exit $rc)"
          $lines = @(
            '### Flaky check (`--lf` re-run)',
            '',
            "Re-running only the failed tests exited with ${rc}: **$verdict**.",
            $(if ($verdict -eq 'passed') { 'The failures did not reproduce; treat them as flaky until proven otherwise.' } else { 'The failures reproduced.' })
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit 0

  select-related:
    name: Select related unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # to download the durations artifact of a main run
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      count: ${{ steps.select.outputs.count }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge-base needs history; blob:none keeps that to commits and
          # trees, since the diff only reads names.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch test durations from the latest full run on main
        # Best effort: without them the selector balances by test count.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow unit-tests.yml --branch main --event push --status completed --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n unit-durations -D "$RUNNER_TEMP/unit-durations"; then
              echo "Using test durations from run $id"
              exit 0
            fi
          done
          echo "No durations artifact found on main; balancing by test count."

      - name: Select tests from the PR diff
        id: select
        # Static analysis only (ast + text); imports nothing from the app, so
        # it needs no dependencies. On any diff failure it falls back to the
        # full selection, never to an empty one.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/ci/select_related_tests.py
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --out-dir related-tests
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"
          --durations "$RUNNER_TEMP/unit-durations"

      - name: Upload selection
        if: steps.select.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: related-tests
          path: related-tests/
          if-no-files-found: error
          retention-days: 7

  unit-pytest-related-shard:
    name: Unit pytest (related shard ${{ matrix.shard }})
    needs: select-related
    if: needs.select-related.outputs.count != '0'
    runs-on: windows-latest
    # ~30% of the full suite per shard: ~10 minutes of pytest plus setup.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select-related.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install test-only native dependencies
        # Same pins as the full job above (checked by test_select_related_tests.py).
        run: |
          uv pip install pyclipper==1.4.0
          uv pip install kaldi-native-fbank==1.22.3

      - name: Download selection
        uses: actions/download-artifact@v4
        with:
          name: related-tests
          path: related-tests

      - name: Run related tests (shard ${{ matrix.shard }})
        # The file list goes in through pytest's `@file` argument: hundreds of
        # paths on the command line would hit the Windows length limit. Same
        # options and -m expression as the full job. Exit code 5 ("no tests
        # collected") means every selected test carried a shard marker on the
        # function level, which unit-test-shards.yml already runs.
        shell: pwsh
        run: |
          uv run pytest "@related-tests/shard-${{ matrix.shard }}.args" -q -n auto --dist loadfile --basetemp "${{ runner.temp }}/neko-unit-related" -m "not unit_fast and not runtime and not integration_serial and not frontend_contract" --junitxml "${{ runner.temp }}/unit-junit/shard-${{ matrix.shard }}.xml" -o junit_family=xunit1
          if ($LASTEXITCODE -eq 5) { exit 0 }
          exit $LASTEXITCODE

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-junit-related-${{ matrix.shard }}
          path: ${{ runner.temp }}/unit-junit/shard-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 7

  unit-pytest-related:
    # The stable, required check for PRs: green when every shard passed or
    # nothing was selected, red when selection or any shard failed.
    name: Unit pytest (related)
    needs: [select-related, unit-pytest-related-shard]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check related test results
        env:
          SELECT_RESULT: ${{ needs.select-related.result }}
          SHARD_RESULT: ${{ needs.unit-pytest-related-shard.result }}
          MODE: ${{ needs.select-related.outputs.mode }}
          COUNT: ${{ needs.select-related.outputs.count }}
        run: |
          echo "selection: $SELECT_RESULT (mode=$MODE, files=$COUNT); shards: $SHARD_RESULT"
          if [ "$SELECT_RESULT" != "success" ]; then
            echo "::error::Selecting related tests failed."
            exit 1
          fi
          if [ "$COUNT" = "0" ]; then
            echo "No unit test depends on this change."
            exit 0
          fi
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::Related unit tests did not pass ($SHARD_RESULT)."
            exit 1
          fi

  plugin-manager-vitest:
    name: Plugin manager vitest
    # 前端侧的同一个洞。frontend/plugin-manager 有 36 个 vitest 文件、327 条用例，
    # 在此之前没有任何 npm 脚本或 workflow 会执行它们：`test:hosted` 只覆盖
    # src/components/plugin/hosted，而 build-desktop.yml 只跑 `npm run build-only`。
    # 结果和 tests/unit 当年一样 —— 补齐依赖后一跑，10 条是红的，其中
    # src/utils/i18nLabel.test.ts 的兜底顺序断言从写下起就没对过。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/plugin-manager/package-lock.json

      - name: Install dependencies
        working-directory: frontend/plugin-manager
        run: npm ci

      - name: Run plugin-manager unit suite
        # 只排除 hosted/e2e（那是 playwright，另有 test:hosted:e2e 负责）。
        # 限定 src 是为了把 scripts/*.test.mjs 挡在外面 —— 它们是 node:test
        # 格式，由 test:hosted-script 单独跑，被 vitest 收进来只会报 no test suite。
        working-directory: frontend/plugin-manager
        run: npm run test:unit

  plugin-manager-e2e:
    name: Plugin manager boot e2e
    # 同一个洞里更深的一层。frontend/plugin-manager/src/e2e/*.e2e.ts（boot 配置：
    # 先 build-only，再由 webServer 起 vite preview 到 4173）此前只有 package.json
    # 里的 `test:boot:e2e` 一条入口，没有任何 workflow 会调用它 —— 连 docs 和
    # scripts/check-hosted-ui.sh 都只提 test:hosted:e2e（那是另一套配置、另一个
    # testDir）。而它守的恰好是 jsdom/happy-dom 看不见的那类回归：撑满链断了不报错、
    # 只会静默变形（面板越界多出外层滚动条、抽屉被 contain:paint 裁掉、双滚动条），
    # vitest 看得见行为看不见布局。所以把它接进 PR 门禁。
    #
    # 注意 `test:boot:e2e` 自己会先跑 build-only：preview 只服务 dist/，不重建就是
    # 在测上一次构建的产物。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/plugin-manager/package-lock.json

      - name: Install dependencies
        working-directory: frontend/plugin-manager
        run: npm ci

      - name: Install Chromium for Playwright
        # 版本跟着 package-lock 里的 @playwright/test 走，不写死。
        working-directory: frontend/plugin-manager
        run: npx playwright install --with-deps chromium

      - name: Run plugin-manager boot e2e suite
        # 25 条：布局几何 14 + 适配器 surface 2 + 启动壳/主题/Element Plus 等 9。
        working-directory: frontend/plugin-manager
        run: npm run test:boot:e2e

  react-neko-chat-checks:
    name: React chat typecheck & vitest
    # 和 plugin-manager 一样的洞，只是更深一层：frontend/react-neko-chat 的
    # 17 个 vitest 文件此前没有任何 PR workflow 会执行，而唯一跑过它类型检查的
    # build-desktop.yml 是 `on: workflow_call`，不是 PR 触发。结果是这个包的
    # 类型错误和测试回归只有打包发版时才会暴露 —— #2948 里就有一个真实的编译
    # 错误（调用点多传了一个不存在的标识符）一路活到 review 才被发现。
    #
    # typecheck 用 `npm run typecheck`（tsc -b --noEmit）。注意不能退回裸的
    # `tsc --noEmit`：tsconfig.json 是 solution-style（"files": [] + references），
    # 那条命令一个文件都不检查，永远绿。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/react-neko-chat/package-lock.json

      - name: Install dependencies
        working-directory: frontend/react-neko-chat
        run: npm ci

      - name: Typecheck
        working-directory: frontend/react-neko-chat
        run: npm run typecheck

      - name: Run react-neko-chat unit suite
        working-directory: frontend/react-neko-chat
        run: npm test

      - name: Run click-guide and seven-day tutorial regression suites
        run: node --test --test-force-exit tests/frontend/click-guide.test.cjs tests/frontend/tutorial-seven-day-state.test.cjs

      - name: Run VRM emotion load-state regression suites
        timeout-minutes: 5
        run: node --test tests/frontend/vrm_emotion_manager.test.cjs tests/frontend/vrm_emotion_source.test.cjs
