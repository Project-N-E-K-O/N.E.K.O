name: PR report gate

# Enforces two project policies against the PR DESCRIPTION:
#   · touching app/ | main_logic/ | memory/ (*.py) → "回归报告" required
#   · changing > 20 counted files                  → "不拆分理由" required
#     (new files, i18n locale files, and tests do not count)
#
# Kept separate from analyze.yml on purpose: this gate must re-run when the
# PR body is edited (author adds the report) or a label changes (maintainer
# applies `report-exempt`), so it listens to `edited` / `labeled` /
# `unlabeled` on top of the usual code-push events. The heavy lint jobs in
# analyze.yml should NOT re-run on every body edit, hence the split.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

# Read-only: the check reads the diff and the PR body, posts nothing.
# pull-requests: read lets it fetch the PR's current body and labels.
permissions:
  contents: read
  pull-requests: read

# Only the newest run per PR matters; label swaps by the review bot used to
# queue a dozen identical runs per PR. GitHub does not guarantee runs enter the
# group in event order, so the surviving run may come from an older event:
# the check therefore reads the body and labels live from the API rather than
# from its own event payload.
concurrency:
  group: pr-report-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-report-gate:
    name: Require regression-report / no-split-rationale in PR body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # The check diffs HEAD against origin/<base> to list changed files.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require change reports in the PR body
        env:
          # Pass PR data through env (not inlined into the run: line) — same
          # zizmor template-injection indirection as analyze.yml's i18n step.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        # Body and labels come from the API, not the event payload: a surviving
        # run triggered by an older event (see the concurrency note above) must
        # still judge the PR's current description and labels.
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          PR_BODY="$(jq -r '.body // ""' <<<"$pr_json")"
          PR_LABELS="$(jq -r '[.labels[].name] | join(",")' <<<"$pr_json")"
          export PR_BODY PR_LABELS
          python scripts/check_pr_report.py --base "origin/${BASE_REF}"
