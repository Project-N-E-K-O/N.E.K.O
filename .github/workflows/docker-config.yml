name: Docker Config

# Docker 侧的配置与宿主脚本回归。
#
# 这几个测试覆盖的都是「不会让镜像构建失败、只会在部署时静默失效」的东西：
#   docker/nginx/      反代配置分层：渲染两种模式 + 分层不变量 + nginx -t
#   docker/watchdog/   宿主自愈看门狗（隔离 harness，mock docker/curl，不碰真实宿主）
#   docker/            宿主预检 preflight.sh（挂载源符号链接与属主）
#   docker/seccomp/    浏览器控制用的 seccomp 配置：在真容器里试（见 docker/seccomp/README.md）
#
# 在此之前它们只能靠人工 sudo 执行，等于没有覆盖。分层背景见 docker/nginx/README.md。

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - '.github/workflows/docker-config.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-config.yml'
  workflow_dispatch:

concurrency:
  group: docker-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-scripts:
    name: Nginx 分层 + 宿主脚本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nginx 只用于 test-render.sh 的可选 T5（nginx -t）；
      # 渲染本身与分层不变量检查不依赖它，缺了只是跳过 T5。
      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx

      # 真解析一遍：YAML 语法、${} 插值、env_file(required: false)、覆盖文件合并。
      # 这些错了 compose 会直接拒绝启动，属于"部署当天才发现"的类型。
      - name: Compose 配置校验
        run: |
          docker compose -f docker/docker-compose.yml config > /dev/null

          # 资源上限示例默认全部注释；用"取消注释后的形态"验证合并结果，
          # 直接合并空覆盖验证不到任何东西。
          sed 's/^    # mem_limit: 2g/    mem_limit: 2g/' \
              docker/compose.limits.example.yaml > /tmp/neko-limits.yaml
          # 注意 compose config 会把字节值加引号输出（mem_limit: "2147483648"），
          # 所以模式必须容忍引号 —— 第一版就是漏了引号，被 CI 抓到的。
          merged=$(docker compose -f docker/docker-compose.yml -f /tmp/neko-limits.yaml config)
          printf '%s\n' "$merged" | grep -qE 'mem_limit: ?"?(2g|2147483648)"?' \
            || { echo "资源上限覆盖文件未生效："; printf '%s\n' "$merged" | head -40; exit 1; }

          # 浏览器覆盖文件：合并结果里 seccomp 指向的必须是仓库里那份配置（写成
          # unconfined、指到别的文件都不算），/dev/shm 的上限也在。它在真容器里
          # 起不起作用由下面的 browser-seccomp 任务试。
          merged=$(docker compose -f docker/docker-compose.yml -f docker/compose.browser.yaml config)
          printf '%s\n' "$merged" | grep -qE '^ +- seccomp[=:][^ ]*seccomp/chromium\.json$' \
            || { echo "浏览器覆盖文件的 seccomp 没有指向 seccomp/chromium.json："; printf '%s\n' "$merged" | head -60; exit 1; }
          [ "$(printf '%s\n' "$merged" | grep -cE 'seccomp[=:]')" = 1 ] \
            || { echo "合并结果里不止一条 seccomp："; printf '%s\n' "$merged" | grep -nE 'seccomp[=:]'; exit 1; }
          printf '%s\n' "$merged" | grep -qE '^ +shm_size: ' \
            || { echo "浏览器覆盖文件的 shm_size 未生效："; printf '%s\n' "$merged" | head -60; exit 1; }

      - name: Nginx 配置分层（渲染 + 分层不变量）
        run: sudo bash docker/nginx/test-render.sh

      - name: 宿主看门狗 harness
        run: sudo bash docker/watchdog/test-watchdog.sh

      - name: 宿主预检 harness
        run: sudo bash docker/test-preflight.sh

      - name: 宿主备份 harness
        run: bash docker/test-backup.sh

  # full 镜像里的 Chromium 要靠 docker/seccomp/chromium.json 才能带着沙箱启动。
  # 这份配置错了不会让任何东西构建失败，只会让部署出来的浏览器起不来，或者放开得
  # 比说的多，所以在真的 Docker 上试：它该放开的放开了、别的没放开、Compose 按文档
  # 的写法带上了它、Debian 的 Chromium 在它下面起得来。
  browser-seccomp:
    name: 浏览器的 seccomp 配置（真容器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库里的这份必须正好是「Docker 的默认配置 + 一条规则」，不接受手工改动。
      - name: 配置与上游的默认配置只差一条规则
        run: bash docker/seccomp/update.sh --check

      # 不带配置时 Docker 本来就放开的话，下面的检查分辨不出配置起没起作用，算失败。
      - name: 在真容器里试
        run: NEKO_SECCOMP_REQUIRE_CONTROL=1 bash docker/seccomp/test-chromium-profile.sh
