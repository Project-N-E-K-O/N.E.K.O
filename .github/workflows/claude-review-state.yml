name: Claude review state

# Keeps the automated Claude review labels honest.
#
# reopen-review: when a converged PR gets new commits, swap `claude-converged`
# back to `claude-review`; the hourly review dispatcher then runs another round
# on the new head. A push that lands while a review round is still running
# skips this job (the PR still carries claude-review). The review session
# therefore re-reads the PR head before applying claude-converged and only
# converges when it matches the commit it just reviewed.
#
# require-codex: a PR may only be marked converged after Codex has reviewed its
# current head. When `claude-converged` is added and no Codex code review of
# the head exists, the label is swapped back to `claude-review`; the
# dispatcher then asks Codex to review. Accepted Codex evidence for the head:
#   - a PR review by chatgpt-codex-connector on that commit,
#   - a Codex code-review receipt naming that commit (a "Codex Review" heading
#     plus "Reviewed commit: `<sha>`"; security-review receipts do not count),
#   - a Codex review-state comment whose code_review is completed on that commit.
#
# pull_request_target is required so the jobs can edit labels on PRs from
# forks. It is safe here: the jobs never check out or run PR code. Label edits
# made with github.token do not trigger further workflow runs.

on:
  pull_request_target:
    types: [synchronize, labeled]

permissions:
  issues: write
  pull-requests: write

jobs:
  reopen-review:
    if: >-
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'claude-converged')
    runs-on: ubuntu-latest
    steps:
      - name: Swap claude-converged back to claude-review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$REPO" --remove-label claude-converged --add-label claude-review

  require-codex:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'claude-converged'
    runs-on: ubuntu-latest
    steps:
      - name: Revert claude-converged unless Codex reviewed the head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CODEX: chatgpt-codex-connector[bot]
        run: |
          set -euo pipefail
          revert() {
            gh pr edit "$PR" --repo "$REPO" --remove-label claude-converged --add-label claude-review
          }
          # Retry transient API failures. If GitHub still cannot be read, fail
          # closed: revert the label (a PR must never stay converged unverified)
          # and fail the job so the error is visible instead of silent.
          fetch() {
            local out
            for _ in 1 2 3; do
              if out=$("$@"); then
                printf '%s\n' "$out"
                return 0
              fi
              sleep 5
            done
            return 1
          }
          # Codex comment filter, one output line per piece of evidence:
          #   - Receipts: walk the body line by line. Each Codex heading line
          #     ("Codex Review: …", "### 💡 Codex Review",
          #     "### 🛡️ Codex Security Review", "## Codex Review Summary")
          #     starts a section; a "Reviewed commit:" line counts only inside
          #     a code-review section, so a security section's commit can never
          #     be credited to a code review in the same comment.
          #   - Review state: parse the whole JSON up to the closing "-->".
          #     If it does not parse, print a marker line instead of dropping
          #     it silently.
          codex_filter='
            .[] | select(.user.login == env.CODEX) | (.body // "")
            | ( reduce (split("\n")[]) as $l ({sec: null, out: []};
                  (if ($l | test("^\\s*(#+\\s*\\S*\\s*)?Codex (Security )?Review\\b"))
                   then .sec = (if ($l | test("^\\s*(Codex Review:|#+\\s*\\S*\\s*Codex Review\\s*$)"))
                                then "code" else "other" end)
                   else . end)
                  | if .sec == "code"
                    then .out += [$l | capture("Reviewed commit:[*` ]*(?<s>[0-9a-f]{7,40})") | .s]
                    else . end)
                | .out[] ),
              ( capture("codex-review-state:v1 (?<j>\\{.*\\})\\s*-->") | .j
                | (try fromjson catch null)
                | if . == null then "STATE_PARSE_ERROR"
                  else (.code_review // {} | select(.status == "completed") | .commit_sha // empty)
                  end )'
          if ! head=$(fetch gh api "repos/$REPO/pulls/$PR" --jq .head.sha) ||
             ! reviews=$(fetch gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                 --jq '.[] | select(.user.login == env.CODEX) | .commit_id') ||
             ! comments=$(fetch gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq "$codex_filter"); then
            echo "::error::Could not read the PR or its Codex reviews; reverting claude-converged to be safe."
            revert
            exit 1
          fi
          if grep -qx STATE_PARSE_ERROR <<<"$comments"; then
            echo "::warning::A Codex review-state comment could not be parsed; it was not counted as evidence."
          fi
          shas=$(printf '%s\n%s\n' "$reviews" "$comments" | grep -E '^[0-9a-f]{7,40}$' || true)
          for sha in $shas; do
            if [[ "$head" == "$sha"* ]]; then
              echo "Codex reviewed head $head; keeping claude-converged."
              exit 0
            fi
          done
          echo "::warning::No Codex review of head $head; reverting claude-converged."
          revert
