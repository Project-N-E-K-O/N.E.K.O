name: Restore patch branch v4
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rebase patch
        run: |
          echo '' | base64 -d > /tmp/restore.patch
          git apply --check /tmp/restore.patch
          git apply /tmp/restore.patch
          git diff --stat
      - name: Commit and push
        run: |
          git config user.name "zaoxi82813"
          git config user.email "zaoxi82813@users.noreply.github.com"
          git add config/prompts/prompts_memory.py app/memory_server/evidence_loops.py
          git commit -m "恢复衰减补丁：丙-0承诺引导+轻-1归档豁免（适配 #3597 后结构）"
          git log --oneline -2
          git push origin HEAD:refs/heads/restore-patch
      - name: Verify hard gate
        if: always()
        run: |
          sleep 3
          RESP=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/branches/restore-patch")
          echo "$RESP" | head -c 200
          echo ""
          echo "$RESP" | grep -q '"name"' && echo "VERIFY_OK branch exists" || exit 1
