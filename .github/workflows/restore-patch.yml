name: Restore patch branch v3
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch dangling patch commits
        run: |
          git fetch origin 47ea787db9d33f6b1969280c15887d63406fe76b d6bef1227f71b9a51f66f8b9f33197f2ebff98f2
      - name: Cherry-pick patches onto main and push
        run: |
          git config user.name "zaoxi82813"
          git config user.email "zaoxi82813@users.noreply.github.com"
          git checkout -b restore-patch
          git cherry-pick 47ea787db9d33f6b1969280c15887d63406fe76b d6bef1227f71b9a51f66f8b9f33197f2ebff98f2
          git log --oneline -3
          git push origin restore-patch
      - name: Verify hard gate
        if: always()
        run: |
          sleep 3
          RESP=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/branches/restore-patch")
          echo "$RESP" | head -c 200
          echo ""
          echo "$RESP" | grep -q '"name"' && echo "VERIFY_OK branch exists" || exit 1
