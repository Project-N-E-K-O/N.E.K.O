name: Plugin Tests

# The plugin-subsystem pytest gate. Scoped to plugin/** (plus the neko-plugin
# skill, whose text guards live in plugin/tests) on purpose: plugin PRs
# historically shipped with no test gate at all, which let silent drift
# accumulate (e.g. #1464's ocr_reader → ocr_window_scanner extraction broke
# monkeypatch namespaces in 4 tests, #1480's install_source field broke the
# query-status expectations — none of it surfaced until a manual full run).
#
# Everything under tests/unit/ is covered by unit-tests.yml (#2492): on every
# PR it runs the tests/unit files related to the change, and on every push to
# main the whole directory. This workflow therefore only runs plugin/tests and
# only triggers on plugin-scoped changes — naming individual tests/unit files
# here would just run them twice.
#
# The whole plugin/tests directory runs on both Linux and Windows. Each OS
# executes cases the other one skips: POSIX fork/exec, symlink, file-mode and
# audit cases only run on Linux; directory junction, Windows shell API and
# msvcrt lock-retry cases only run on Windows. Windows-only cases skip on Linux
# instead of failing, so no file list is kept here.
on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'utils/process_creation.py'
      - '.github/workflows/plugin-tests.yml'
      # test_plugin_market_workflows.py pins these reusable workflows' structure.
      - '.github/workflows/plugin-market-*.yml'
      # The neko-plugin skill is copied into new plugin projects; its text
      # guards live in plugin/tests (test_neko_plugin_agent_guides.py).
      - '.agent/skills/neko-plugin/**'
      # Dependency changes alter the plugin test/runtime environment (e.g.
      # removing a dev dep plugin/tests needs) — without these a deps-only
      # PR skips the gate and the breakage surfaces on the next plugin PR.
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'utils/process_creation.py'
      - '.github/workflows/plugin-tests.yml'
      # test_plugin_market_workflows.py pins these reusable workflows' structure.
      - '.github/workflows/plugin-market-*.yml'
      - '.agent/skills/neko-plugin/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

# The test job only needs to read the checked-out source.
permissions:
  contents: read

concurrency:
  group: plugin-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin-pytest-linux:
    name: Plugin pytest (Linux)
    runs-on: ubuntu-latest
    # The full suite takes about 4 min on ubuntu-latest with -n auto.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run plugin test suite
        # Same explicit path as the Windows job, so the testpaths whitelist in
        # plugin/tests/pytest.ini does not narrow collection. Real fork/exec
        # process creation (inherited pipe race, child-side lock reset) is
        # covered here; the Windows job skips those cases. -n auto: the suite
        # is isolated per test (tmp_path runtime roots, git identity) and
        # runs under pytest-xdist. --dist loadfile, as in the other xdist
        # calls (see pyproject.toml): each file stays on one worker in order,
        # so the seed pinned in plugin/tests/pytest.ini stays reproducible.
        run: uv run pytest plugin/tests -n auto --dist loadfile -q --durations=20

  plugin-pytest:
    name: Plugin pytest (Windows, ${{ matrix.label }})
    # Windows is the product's primary desktop platform. Directory junction,
    # Windows shell API and msvcrt lock-retry cases only execute here; the
    # Linux job skips them. Native-extra cohorts that are genuinely optional
    # (dxcam etc.) self-skip when not installed.
    runs-on: windows-latest
    timeout-minutes: 30
    # TEMPORARY experiment matrix (removed before merge): compares serial and
    # xdist runs, all with the pytest basetemp on the runner work drive.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: A-serial
            xdist: ''
          - label: B-n2
            xdist: '-n 2 --dist loadfile'
          - label: C-n4
            xdist: '-n 4 --dist loadfile'
          - label: D-nauto
            xdist: '-n auto --dist loadfile'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        # Plain `uv sync` = main deps + dev group (pytest, pytest-asyncio,
        # hypothesis, PyInstaller). The galgame group (rapidocr + cv2, ~130 MB) is NOT
        # installed — the plugin degrades its OCR backend gracefully and the
        # affected tests mock or skip that cohort.
        run: uv sync

      - name: Run plugin test suite
        # Explicit path (not bare `pytest` under plugin/tests): passing the
        # directory overrides the testpaths whitelist in plugin/tests/
        # pytest.ini, so unit/plugins — where the silent drift lived — is
        # collected too.
        # --durations keeps the slowest cases visible in the log, for deciding
        # whether this serial run needs pytest-xdist.
        run: |
          Write-Host "runner.temp=${{ runner.temp }} NUMBER_OF_PROCESSORS=$env:NUMBER_OF_PROCESSORS"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free -AutoSize
          uv run python -c "import psutil; print('xdist auto workers (physical cores):', psutil.cpu_count(logical=False), 'logical:', psutil.cpu_count())"
          uv run pytest plugin/tests -q ${{ matrix.xdist }} --basetemp "${{ runner.temp }}/neko-plugin-tests" --durations=0
