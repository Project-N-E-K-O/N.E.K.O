name: Plugin Tests

# The plugin-subsystem pytest gate. Scoped to plugin/** (plus the neko-plugin
# skill, whose text guards live in plugin/tests) on purpose: plugin PRs
# historically shipped with no test gate at all, which let silent drift
# accumulate (e.g. #1464's ocr_reader → ocr_window_scanner extraction broke
# monkeypatch namespaces in 4 tests, #1480's install_source field broke the
# query-status expectations — none of it surfaced until a manual full run).
#
# Everything under tests/unit/ is covered by unit-tests.yml (#2492): on every
# PR it runs the tests/unit files related to the change, and on every push to
# main the whole directory. This workflow therefore only runs plugin/tests and
# only triggers on plugin-scoped changes — naming individual tests/unit files
# here would just run them twice.
#
# The whole plugin/tests directory runs on both Linux and Windows. Each OS
# executes cases the other one skips: POSIX fork/exec, symlink, file-mode and
# audit cases only run on Linux; directory junction, Windows shell API and
# msvcrt lock-retry cases only run on Windows. Windows-only cases skip on Linux
# instead of failing, so no file list is kept here.
on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'utils/process_creation.py'
      - '.github/workflows/plugin-tests.yml'
      # test_plugin_market_workflows.py pins these reusable workflows' structure.
      - '.github/workflows/plugin-market-*.yml'
      # The neko-plugin skill is copied into new plugin projects; its text
      # guards live in plugin/tests (test_neko_plugin_agent_guides.py).
      - '.agent/skills/neko-plugin/**'
      # Dependency changes alter the plugin test/runtime environment (e.g.
      # removing a dev dep plugin/tests needs) — without these a deps-only
      # PR skips the gate and the breakage surfaces on the next plugin PR.
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'utils/process_creation.py'
      - '.github/workflows/plugin-tests.yml'
      # test_plugin_market_workflows.py pins these reusable workflows' structure.
      - '.github/workflows/plugin-market-*.yml'
      - '.agent/skills/neko-plugin/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

# The test job only needs to read the checked-out source.
permissions:
  contents: read

concurrency:
  group: plugin-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin-pytest-linux:
    name: Plugin pytest (Linux)
    runs-on: ubuntu-latest
    # The full suite takes about 4 min on ubuntu-latest with -n auto. A hung
    # test costs up to 5 min (the timeout in plugin/tests/pytest.ini) in the
    # full run and 5 more in the flaky check, hence the margin.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run plugin test suite
        id: full-suite
        # Same explicit path as the Windows job, so the testpaths whitelist in
        # plugin/tests/pytest.ini does not narrow collection. Real fork/exec
        # process creation (inherited pipe race, child-side lock reset) is
        # covered here; the Windows job skips those cases. -n auto: the suite
        # is isolated per test (tmp_path runtime roots, git identity) and
        # runs under pytest-xdist. --dist loadfile, as in the other xdist
        # calls (see pyproject.toml): each file stays on one worker in order,
        # so the seed pinned in plugin/tests/pytest.ini stays reproducible.
        run: uv run pytest plugin/tests -n auto --dist loadfile -q --durations=20

      - name: Re-run failed tests once (flaky check)
        # Same step as the Windows job below and unit-tests.yml: `--lf` runs only
        # the tests the full run recorded as failed (the xdist controller writes
        # them to cache_dir in plugin/tests/pytest.ini), `--lfnf none` keeps an
        # empty record from re-running everything. The job stays red either
        # way; main-red-reporter.yml reads the NEKO_LF_RERUN_RESULT line from
        # this job's log and labels the issue `flaky` when the re-run passed.
        # `timeout 420`: here (signal method) every hung test in the re-run
        # takes its full 300 s and the next one starts, so two of them would
        # outlast the step limit and the step would be killed before printing
        # the verdict. Stopping pytest first reports them as `failed` (exit
        # 124). The Windows re-run cannot get there: its first hung test ends
        # the pytest process.
        if: failure() && steps.full-suite.outcome == 'failure'
        timeout-minutes: 8
        run: |
          rc=0
          timeout -k 10 420 uv run pytest plugin/tests -q -n 0 --lf --lfnf none || rc=$?
          if [ "$rc" -eq 0 ]; then verdict=passed; else verdict=failed; fi
          echo "NEKO_LF_RERUN_RESULT=$verdict (pytest exit $rc)"
          {
            echo '### Flaky check (`--lf` re-run)'
            echo
            echo "Re-running only the failed tests exited with ${rc}: **$verdict**."
            if [ "$rc" -eq 124 ]; then
              echo 'The re-run was stopped after 7 min.'
            fi
            if [ "$verdict" = passed ]; then
              echo 'The failures did not reproduce; treat them as flaky until proven otherwise.'
            else
              echo 'The failures reproduced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  plugin-pytest:
    name: Plugin pytest (Windows)
    # Windows is the product's primary desktop platform. Directory junction,
    # Windows shell API and msvcrt lock-retry cases only execute here; the
    # Linux job skips them. Native-extra cohorts that are genuinely optional
    # (dxcam etc.) self-skip when not installed.
    runs-on: windows-latest
    # The whole job takes about 6 min with -n 4 (14 min serial) when the uv
    # cache hits. A uv.lock change misses the cache and makes `uv sync`
    # slower, which that measurement does not include, hence the margin. A
    # hung test adds up to 5 min to the full run and 5 to the flaky check.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        # Plain `uv sync` = main deps + dev group (pytest, pytest-asyncio,
        # pytest-xdist for the -n 4 run below, hypothesis, PyInstaller).
        # The galgame group (rapidocr + cv2, ~130 MB) is NOT
        # installed — the plugin degrades its OCR backend gracefully and the
        # affected tests mock or skip that cohort.
        run: uv sync

      - name: Run plugin test suite
        id: full-suite
        # Explicit path (not bare `pytest` under plugin/tests): passing the
        # directory overrides the testpaths whitelist in plugin/tests/
        # pytest.ini, so unit/plugins — where the silent drift lived — is
        # collected too.
        # -n 4 --dist loadfile: in one measured run on windows-latest (4
        # logical / 2 physical cores) against serial, -n 2 and -n auto, -n 4
        # was the fastest with identical passed/skipped counts (PR #4176).
        # -n auto is not used because it counts physical cores and starts
        # only 2 workers here.
        # loadfile keeps each file on one worker in order, as in the Linux job.
        # --basetemp puts tmp_path on the runner work drive (D:) instead of the
        # default %TEMP% on C:, and outside the checkout.
        # --max-worker-restart 0: Windows has no signal-based timeout, so a test
        # that hits the limit in plugin/tests/pytest.ini ends its worker process.
        # --dist loadfile then puts that test back in the queue along with the
        # rest of its file, and with xdist's default of 4 restarts per worker
        # (16 here) the same hung test would run again and again, 5 min each,
        # until the job ceiling. With 0 the first crash ends the run: the job is
        # red, the crashed test is recorded for the flaky check below, and tests
        # not yet run at that point are not run.
        run: uv run pytest plugin/tests -n 4 --dist loadfile --max-worker-restart 0 --basetemp "${{ runner.temp }}/neko-plugin-tests" -q --durations=20

      - name: Re-run failed tests once (flaky check)
        # Same step as the Linux job above and unit-tests.yml; see the comment
        # there.
        if: failure() && steps.full-suite.outcome == 'failure'
        timeout-minutes: 8
        shell: pwsh
        run: |
          uv run pytest plugin/tests -q -n 0 --lf --lfnf none --basetemp "${{ runner.temp }}/neko-plugin-rerun"
          $rc = $LASTEXITCODE
          $verdict = if ($rc -eq 0) { 'passed' } else { 'failed' }
          Write-Host "NEKO_LF_RERUN_RESULT=$verdict (pytest exit $rc)"
          $lines = @(
            '### Flaky check (`--lf` re-run)',
            '',
            "Re-running only the failed tests exited with ${rc}: **$verdict**.",
            $(if ($verdict -eq 'passed') { 'The failures did not reproduce; treat them as flaky until proven otherwise.' } else { 'The failures reproduced.' })
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit 0
