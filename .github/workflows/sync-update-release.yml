name: Sync Published Stable Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync:
    # A stable release must be deliberately published after local testing.
    # Drafts and prereleases never become update-service metadata.
    if: >-
      github.repository == 'Project-N-E-K-O/N.E.K.O' &&
      !github.event.release.draft &&
      !github.event.release.prerelease &&
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Validate stable release assets
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable release tag must be vMAJOR.MINOR.PATCH; got $TAG"
            exit 1
          fi

          gh release view "$TAG" --json assets --jq '.assets[].name' > assets.txt
          required=(
            "N.E.K.O_${VERSION}_win.zip"
            "N.E.K.O_${VERSION}_win_manifest.json"
            "N.E.K.O_${VERSION}_win_manifest.json.sig"
            "N.E.K.O_${VERSION}_mac_x64.tar.gz"
            "N.E.K.O_${VERSION}_mac_x64_manifest.json"
            "N.E.K.O_${VERSION}_mac_x64_manifest.json.sig"
            "N.E.K.O_${VERSION}_mac_arm64.tar.gz"
            "N.E.K.O_${VERSION}_mac_arm64_manifest.json"
            "N.E.K.O_${VERSION}_mac_arm64_manifest.json.sig"
            "N.E.K.O_${VERSION}_linux_x64.tar.gz"
            "N.E.K.O_${VERSION}_linux_x64_manifest.json"
            "N.E.K.O_${VERSION}_linux_x64_manifest.json.sig"
            "N.E.K.O_${VERSION}_linux_x64_appimage.AppImage"
            "N.E.K.O_${VERSION}_linux_x64_appimage_manifest.json"
            "N.E.K.O_${VERSION}_linux_x64_appimage_manifest.json.sig"
          )
          missing=0
          for asset in "${required[@]}"; do
            if ! grep --fixed-strings --quiet --line-regexp "$asset" assets.txt; then
              echo "::error::Published release is missing required update asset: $asset"
              missing=1
            fi
          done
          (( missing == 0 ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Only list mirrors that have already received and verified every asset.
      # An empty value intentionally keeps GitHub Release as the download source.
      - name: Sync release metadata to update service
        env:
          NEKO_UPDATE_SERVER: ${{ vars.NEKO_UPDATE_SERVER }}
          NEKO_UPDATE_ADMIN_TOKEN: ${{ secrets.NEKO_UPDATE_ADMIN_TOKEN }}
          NEKO_UPDATE_MIRROR_IDS: ${{ vars.NEKO_UPDATE_MIRROR_IDS }}
          NEKO_UPDATE_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${NEKO_UPDATE_SERVER:-}" || -z "${NEKO_UPDATE_ADMIN_TOKEN:-}" ]]; then
            echo "::warning::Skipping update-service sync: configure NEKO_UPDATE_SERVER and NEKO_UPDATE_ADMIN_TOKEN to enable it."
            exit 0
          fi
          if [[ "$NEKO_UPDATE_SERVER" != https://* ]]; then
            echo "::error::NEKO_UPDATE_SERVER must be an HTTPS URL"
            exit 1
          fi

          mirror_ids="$(jq -cn --arg values "${NEKO_UPDATE_MIRROR_IDS:-}" \
            '$values | split(",") | map(gsub("^\\s+|\\s+$"; "") | select(length > 0))')"
          payload="$(jq -cn \
            --arg version "$NEKO_UPDATE_VERSION" \
            --argjson mirror_ids "$mirror_ids" \
            '{version: $version, mirror_ids: $mirror_ids}')"

          curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --silent --show-error \
            --request POST "${NEKO_UPDATE_SERVER%/}/v1/admin/N.E.K.O/stable/sync" \
            --header "Authorization: Bearer $NEKO_UPDATE_ADMIN_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload"
