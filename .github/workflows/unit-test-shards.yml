name: Unit Test Shards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-test-shards-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-shard:
    name: ${{ matrix.name }} (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit-fast
            marker: unit_fast
            pytest_args: "-n auto --dist loadfile"
          - name: runtime
            marker: runtime
            pytest_args: "-n 2 --dist loadfile"
          - name: integration-serial
            marker: integration_serial
            pytest_args: "-n 0"
          - name: frontend-contract
            marker: frontend_contract
            pytest_args: "-n 0"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install test-only native dependencies
        run: |
          uv pip install pyclipper==1.4.0
          uv pip install kaldi-native-fbank==1.22.3

      - name: Prepare isolated pytest temp directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force ".codex-tmp\${{ matrix.marker }}" | Out-Null

      # 只把写了 mark.<marker> 的测试文件交给 pytest：给它整个 tests/unit 的话，
      # 要先导入全部约 1700 个测试文件和它们拉进来的应用代码，新机器上光这一下
      # 就是约 5 分钟冷启动，而一个分片只用得到几十个文件。下面照样带 -m，选中
      # 文件里没标记的用例仍被筛掉。标记经别的模块间接带进来的情况文本看不到，
      # 由下面的 shard-selection-audit 在 main 上逐条比对用例 id 兜底。
      # 一个文件都没选中时脚本直接报错退出，不会把空参数文件交给 pytest。
      - name: Select ${{ matrix.name }} test files
        run: uv run python scripts/ci/select_shard_files.py select --marker ${{ matrix.marker }} --out "${{ runner.temp }}\shard-${{ matrix.marker }}.args"

      # 空分片在这一步直接判：pytest 没收集到任何用例时退出码是 5（xdist 下也一样），
      # 标记写错或分片被清空都会落到这里。以前单独跑一遍 --collect-only 做检查，
      # 等于把 6 万多条用例多收集一遍，每个分片白花几十秒。
      - name: Run ${{ matrix.name }}
        shell: pwsh
        run: |
          uv run pytest "@${{ runner.temp }}\shard-${{ matrix.marker }}.args" -m "${{ matrix.marker }}" -q ${{ matrix.pytest_args }} --basetemp ".codex-tmp\${{ matrix.marker }}"
          $code = $LASTEXITCODE
          if ($code -eq 5) {
            throw "Marker '${{ matrix.marker }}' collected no tests."
          }
          exit $code

      - name: Prepare pinned models for strict enrollment duration acceptance
        if: matrix.marker == 'integration_serial'
        run: |
          uv run scripts/prepare_voice_turn_assets.py
          uv run scripts/prepare_speaker_model.py

      - name: Run strict enrollment acceptance with real RNNoise, Silero and CAM++
        if: matrix.marker == 'integration_serial'
        run: uv run pytest tests/integration/test_voice_enrollment_duration_real.py -q --basetemp ".codex-tmp\voice-enrollment-duration-real"

  # 上面的分片只收集 select_shard_files.py 按文本选出的文件。这里收集一遍整个
  # tests/unit，再分别收集每个分片的选择（带 -m），两边用例 id 必须完全一致，
  # 否则红：标记经导入的基类、别的模块里的装饰器、conftest 钩子等间接带进来时，
  # 分片会静默少跑，而 unit-tests.yml 的全量 job 又把这些标记全部筛掉，没有别处
  # 会跑到它们。全量收集冷启动约 6 分钟，所以只在合进 main 后（和手动）跑；红了
  # 由 main-red-reporter.yml 开 issue。
  shard-selection-audit:
    name: shard selection audit
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # 与分片相同的依赖：缺了的话部分文件在模块级 importorskip，两边一起少，比对就看不到它们。
      - name: Install test-only native dependencies
        run: uv pip install pyclipper==1.4.0 kaldi-native-fbank==1.22.3

      - name: Compare shard selections with a full collection
        run: uv run python scripts/ci/select_shard_files.py audit

  historical-review-audit:
    name: historical review audit
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # No filter: blob:none here. A partial clone lazily fetches any
          # missing commit too, so the audit would also reach revisions the
          # step below never fetched — tests that skip today would start running.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install test-only native dependencies
        run: |
          uv pip install pyclipper==1.4.0
          uv pip install kaldi-native-fbank==1.22.3

      - name: Verify historical revisions are present
        shell: pwsh
        run: |
          $revisions = @(
            '16a48f711f6842e3fbd181c41675459bb3c025bc',
            '52556bde9a824ad25354ad15ab3ffbff4b1ed9c4'
          )
          foreach ($revision in $revisions) {
            git fetch --no-tags origin $revision
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch historical review revision '$revision'."
            }
            git cat-file -e "$revision^{commit}"
            if ($LASTEXITCODE -ne 0) {
              throw "Historical review revision '$revision' is unavailable."
            }
          }

      - name: Prepare historical audit temp directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force ".codex-tmp\historical-review-audit" | Out-Null

      - name: Run historical review evidence
        shell: pwsh
        run: |
          $report = ".codex-tmp\historical-review-audit-report.xml"
          uv run pytest tests/unit/test_pr3078_review_evidence.py -q -rs --basetemp ".codex-tmp\historical-review-audit" --junitxml $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 本 job 已拉取全部历史提交，任何 skip 都意味着审计静默失效。
          $suite = ([xml](Get-Content $report)).testsuites.testsuite
          if ([int]$suite.tests -eq 0 -or [int]$suite.skipped -ne 0) {
            throw "Historical review audit must run every case: tests=$($suite.tests) skipped=$($suite.skipped)."
          }

  frontend-node:
    name: frontend-contract (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend contract tests
        run: |
          node --test static/voice-identity.test.cjs static/voice-readiness.test.cjs
          node --test tests/frontend/asr_input_delivery_status.test.cjs
          node --test tests/frontend/audio_message_host.test.cjs
          node --test tests/frontend/audio_message_visit.test.cjs
          node --test tests/frontend/mic_recovery_route.test.cjs
          node --test tests/frontend/voice_preparing_toast.test.cjs
          node --test tests/frontend/pngtuber_tracked_animation.test.cjs
          node --test tests/frontend/feedback_devices.test.cjs tests/frontend/feedback_information.test.cjs
          node --test tests/frontend/remote_voice_manager.test.cjs tests/frontend/voice_manager_review.test.cjs tests/frontend/api_key_secret_masking.test.cjs tests/frontend/remote_voice_page_diagnostics.test.cjs
          node --test tests/frontend/voice_preview.test.cjs
          node --test tests/frontend/voice_recovery.test.cjs
          node --test tests/frontend/computer_use_capture_lifecycle.test.cjs
          node --test tests/frontend/test_game_voice_control_runtime.js
          node tests/frontend/test_storage_error_messages_runtime.js
          node --test tests/frontend/vrm_guided_facing.test.cjs
          node --test tests/frontend/vrm_guided_lifecycle.test.cjs
          node --test tests/frontend/vrm_animation_translation.test.cjs
          node --test tests/frontend/vrm_preferences_persistence.test.cjs
          node --test tests/frontend/vrm_shadow_bounds.test.cjs
          node --test tests/frontend/three_host_model_drag_ownership.test.cjs
          node --test tests/frontend/live2d_lipsync_ownership.test.cjs tests/frontend/live2d_expression_lipsync.test.cjs tests/frontend/live2d_audio_ownership.test.cjs tests/frontend/live2d_guide_lipsync.test.cjs
          # tests/unit/*.test.js 是 pytest 永不收集的 node:test 文件；用 glob
          # 而非手列清单，新增文件无法再静默绕过 CI。
          node --test tests/unit/*.test.js

      - name: Run cat tier presentation and gravity regressions
        run: >-
          node --test
          tests/frontend/desktop_window_gravity.test.cjs
          tests/frontend/desktop_window_sensing_cat1.test.cjs
          tests/frontend/cat_happy_independent_action.test.cjs
          tests/frontend/cat_drag_interruption_semantics.test.cjs
          tests/frontend/cat_playground_drag_semantics.test.cjs
          tests/frontend/cat_playground_legacy_consumers.test.cjs
          tests/frontend/cat_playground_basic_interactions.test.cjs
          tests/frontend/cat_playground_stationary_actions.test.cjs
          tests/frontend/cat_playground_small_move.test.cjs
          tests/frontend/cat_playground_yarn_movement.test.cjs
          tests/frontend/cat_playground_yarn_action.test.cjs
          tests/frontend/step6_dock_boundary.test.cjs
          tests/frontend/cat_small_move_provider_purity.test.cjs
          tests/frontend/cat_physical_activity_facts.test.cjs
          tests/frontend/cat_eat_action_variants.test.cjs
          tests/frontend/cat1_idle_random_scheduler.test.cjs
          tests/frontend/cat_mind_scheduler_recheck.test.cjs
          tests/frontend/collision_deformation.test.cjs

  cat-basic-interactions-browser:
    name: cat basic interactions (Chromium actual page)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked browser test dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          packages = tomllib.loads(pathlib.Path('uv.lock').read_text())['package']
          names = {'pytest', 'pytest-playwright', 'playwright', 'pillow'}
          pinned = [f"{p['name']}=={p['version']}" for p in packages if p['name'] in names]
          assert len(pinned) == len(names), 'Browser test dependencies must be locked'
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *pinned])
          PY
          python -m playwright install --with-deps chromium

      - name: Run shared cat interactions on the actual page
        run: >-
          python -m pytest -c /dev/null --confcutdir=tests/frontend
          tests/frontend/test_avatar_ui_buttons_split.py
          tests/frontend/test_cat_playground_basic_interactions.py
          tests/frontend/test_cat_playground_stationary_actions.py
          tests/frontend/test_cat_playground_small_move.py
          tests/frontend/test_cat_playground_yarn_movement.py
          tests/frontend/test_cat_playground_yarn_action.py
          --browser chromium -q -o cache_dir=${{ runner.temp }}/cat-basic-pytest-cache

  social-hub-presence-browser:
    name: social hub presence (Chromium actual page)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Run social hub presence menu browser regressions
        run: python tests/frontend/test_social_hub_presence_browser.py -v

  remote-voice-chromium:
    name: remote voice manager (Chromium actual page)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and its Chromium
        # 版本跟着 package-lock 里的 @playwright/test 走，不写死：npm ci 与
        # npx --no-install 读的是同一份 node_modules，不会对不上。
        working-directory: frontend/plugin-manager
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      - name: Run actual remote voice manager page
        env:
          NEKO_TEST_PLAYWRIGHT_MODULE: ${{ github.workspace }}/frontend/plugin-manager/node_modules/playwright
          NEKO_TEST_ARTIFACT_DIR: ${{ runner.temp }}/remote-voice-chromium
        run: node tests/frontend/remote_voice_manager_browser.cjs

      - name: Run actual voice preview cancellation page
        env:
          NEKO_TEST_PLAYWRIGHT_MODULE: ${{ github.workspace }}/frontend/plugin-manager/node_modules/playwright
          NEKO_TEST_ARTIFACT_DIR: ${{ runner.temp }}/voice-preview-chromium
        run: node tests/frontend/voice_preview_browser.cjs

      - name: Run actual prepared overwrite recovery page
        env:
          NEKO_TEST_PLAYWRIGHT_MODULE: ${{ github.workspace }}/frontend/plugin-manager/node_modules/playwright
          NEKO_TEST_ARTIFACT_DIR: ${{ runner.temp }}/voice-recovery-chromium
        run: node tests/frontend/voice_recovery_browser.cjs

      - name: Retain remote voice Chromium diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-voice-chromium-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/remote-voice-chromium
            ${{ runner.temp }}/voice-preview-chromium
            ${{ runner.temp }}/voice-recovery-chromium
          if-no-files-found: warn

  voice-enrollment-browser:
    name: voice enrollment duration (Chromium actual page)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install fixed Playwright test runtime and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/voice-enrollment-browser" --no-audit --no-fund --save-exact playwright@1.62.1
          "$RUNNER_TEMP/voice-enrollment-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run actual enrollment page and AudioWorklet with fixed quiet speech
        env:
          NODE_PATH: ${{ runner.temp }}/voice-enrollment-browser/node_modules
        run: |
          VOICE_ENROLLMENT_BROWSER_LOCALE=en-US node tests/frontend/voice_enrollment_duration_browser.cjs
          VOICE_ENROLLMENT_BROWSER_LOCALE=zh-CN node tests/frontend/voice_enrollment_duration_browser.cjs

  voice-readiness-electron:
    name: voice readiness (Electron actual page)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated fixed Electron test runtime
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/voice-readiness-electron" --no-audit --no-fund --save-exact electron@41.2.0

      - name: Run actual enrollment template and AudioWorklet with fake input
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          node "$env:RUNNER_TEMP/voice-readiness-electron/node_modules/electron/cli.js" tests/frontend/voice_identity_electron.cjs
          if ($LASTEXITCODE -ne 0) { throw "Voice readiness Electron test failed ($LASTEXITCODE)." }
          node "$env:RUNNER_TEMP/voice-readiness-electron/node_modules/electron/cli.js" tests/frontend/mic_capture_electron.cjs
          if ($LASTEXITCODE -ne 0) { throw "Microphone capture Electron test failed ($LASTEXITCODE)." }

      - name: Run actual remote voice manager page
        shell: pwsh
        env:
          NEKO_TEST_ARTIFACT_DIR: ${{ runner.temp }}/remote-voice-electron
          NEKO_TEST_ELECTRON_MODULE: ${{ runner.temp }}/voice-readiness-electron/node_modules/electron
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          node tests/frontend/remote_voice_electron_runner.cjs tests/frontend/remote_voice_manager_electron.cjs
          if ($LASTEXITCODE -ne 0) { throw "Remote voice manager Electron test failed ($LASTEXITCODE)." }

      - name: Run actual voice preview cancellation page
        shell: pwsh
        env:
          NEKO_TEST_ARTIFACT_DIR: ${{ runner.temp }}/voice-preview-electron
          NEKO_TEST_ELECTRON_MODULE: ${{ runner.temp }}/voice-readiness-electron/node_modules/electron
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          node tests/frontend/remote_voice_electron_runner.cjs tests/frontend/voice_preview_electron.cjs
          if ($LASTEXITCODE -ne 0) { throw "Voice preview Electron test failed ($LASTEXITCODE)." }

      - name: Run actual prepared overwrite recovery page
        shell: pwsh
        env:
          NEKO_TEST_ARTIFACT_DIR: ${{ runner.temp }}/voice-recovery-electron
          NEKO_TEST_ELECTRON_MODULE: ${{ runner.temp }}/voice-readiness-electron/node_modules/electron
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          node tests/frontend/remote_voice_electron_runner.cjs tests/frontend/voice_recovery_electron.cjs
          if ($LASTEXITCODE -ne 0) { throw "Voice recovery Electron test failed ($LASTEXITCODE)." }

      - name: Retain remote voice Electron diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-voice-electron-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/remote-voice-electron
            ${{ runner.temp }}/voice-preview-electron
            ${{ runner.temp }}/voice-recovery-electron
          if-no-files-found: warn
