# =============================================================================
# 可选的资源上限覆盖文件（示例）
# =============================================================================
#
#   docker compose -f docker-compose.yml -f compose.limits.example.yaml up -d
#
# 为什么不给默认值：给多少是**容量决策**，取决于你的负载。套经验值比不设更危险 ——
# 设小了会在峰值时 OOM-kill，而症状是"某个功能突然不好使"，跟内存看起来毫无关系。
#
# 所以本文件全部注释掉，数值必须来自你自己的实测。测量方法与判读见
# docker/README_Docker.md「内存与 CPU 上限」一节。
#
# 不设上限时 Docker 不做任何保护：宿主 OOM killer 按自己的评分挑进程杀，
# 通常挑内存占用最大的那个 —— 也就是你的主服务或插件进程。
# =============================================================================

services:
  neko-main:
    # 容器内存上限。经验起点：实测峰值的 1.5~2 倍；低于峰值必然随机 OOM-kill。
    # mem_limit: 2g

    # 内存 + swap 合计上限。设为与 mem_limit 相同可禁止容器使用 swap
    # （swap 能让容器活下来，但延迟会显著恶化）。
    # memswap_limit: 2g

    # 软性预留（调度提示，非硬限制）。
    # mem_reservation: 512m

    # CPU 上限，单位是核数，可用小数。
    # cpus: 2.0

    # 进程/线程数上限，防止插件泄漏 fork。
    # pids_limit: 4096

    # ⚠️ 不要设 oom_kill_disable：容器里的进程杀不掉时，压力会转移到宿主机，
    #    最终整机卡死，比让一个容器被 OOM-kill 严重得多。
