# Project N.E.K.O. - 社区 2C2G 部署方案
# Author: 烨儿不会飞 (GitHub: @csy-11)
# Compose >= 2.24.4；继承同一仓库的官方服务配置。
services:
  neko-init:
    image: alpine:3.20
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # 每条检查独立失败退出；不递归修改目录中的宿主资源。
        test ! -L /host-dir/neko-home
        test ! -L /host-dir/logs
        mkdir -p /host-dir/neko-home /host-dir/logs
        chown -h 1000:1000 /host-dir/neko-home /host-dir/logs
    volumes:
      - .:/host-dir

  neko-main:
    extends:
      file: ../docker-compose.yml
      service: neko-main
    # 对外使用前核验镜像包含 #3289/#3299，并固定经验证的 tag/digest。
    image: ${NEKO_IMAGE:-docker.gh-proxy.org/ghcr.io/project-n-e-k-o/n.e.k.o:latest-full}
    labels:
      org.neko.community-2c2g.watchdog: enabled
    depends_on:
      neko-init:
        condition: service_completed_successfully
    environment:
      - SSL_DOMAIN=${SSL_DOMAIN:-localhost}
      - NEKO_TRUSTED_HOSTS=${NEKO_TRUSTED_HOSTS:-}
      - NEKO_TRUSTED_ORIGINS=${NEKO_TRUSTED_ORIGINS:-}
    # 覆盖继承服务的相对路径，数据留在 community-2c2g/。
    volumes: !override
      - ./neko-home:/home/neko
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  neko-cron-install:
    profiles: [watchdog]
    image: alpine:3.20
    restart: "no"
    depends_on:
      neko-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/source/install-watchdog.sh"]
    volumes:
      - /etc/cron.d:/host-cron.d
      - /opt:/host-opt
      - ./install-watchdog.sh:/source/install-watchdog.sh:ro
      - ./watchdog.sh:/source/watchdog.sh:ro

networks:
  neko-network:
    driver: bridge
