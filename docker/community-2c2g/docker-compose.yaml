# ============================================================================
# Project N.E.K.O. - 自适应部署方案（全自动初始化 + 自愈看门狗）
# Author: 烨儿不会飞 (GitHub: @csy-11, Bilibili: 烨儿不会飞,爱发电：https://afdian.com/a/chensye)
# 说明: 必须使用 Compose V2 (docker compose，不能是 docker-compose)
# ============================================================================
services:
  neko-init:
    image: alpine:3.20
    container_name: neko-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "开始初始化 N.E.K.O 运行环境..."
        mkdir -p /host-dir/neko-home /host-dir/logs /host-dir/nginx
        chown -R 1000:1000 /host-dir/neko-home /host-dir/logs /host-dir/nginx || true
        echo "初始化完成！环境已就绪。"
    volumes:
      - .:/host-dir
    networks:
      - neko-network

  neko-main:
    image: ${NEKO_IMAGE:-docker.gh-proxy.org/ghcr.io/project-n-e-k-o/n.e.k.o:latest-full}
    # 选项1：加速代理 + 标准版
    # image: docker.gh-proxy.org/ghcr.io/project-n-e-k-o/n.e.k.o:latest
    # 选项2：官方源 + 完整版（海外服务器推荐）
    # image: ghcr.io/project-n-e-k-o/n.e.k.o:latest-full
    container_name: neko
    restart: unless-stopped
    depends_on:
      neko-init:
        condition: service_completed_successfully
    environment:
      - TZ=Asia/Shanghai
      - NEKO_KEEP_CUSTOM_NGINX_CONF=1
      # 如果需要外网域名访问，取消下方注释并填入你的域名/IP
      # - NEKO_TRUSTED_HOSTS=your-domain.duckdns.org
      # - NEKO_TRUSTED_ORIGINS=https://your-domain.duckdns.org:48912
    ports:
      - "48911:80"
      - "48912:443"
      - "48915:48915"
    volumes:
      - ./neko-home:/home/neko
      - ./logs:/app/logs
      - ./nginx:/etc/nginx/conf.d
    networks:
      - neko-network

  # cron 安装器（一次性，跑完即退）
  neko-cron-install:
    image: alpine:3.20
    container_name: neko-cron-install
    restart: "no"
    depends_on:
      neko-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /host-opt/neko
        cat > /host-opt/neko/watchdog.sh <<'WATCHDOG_EOF'
        #!/bin/bash
        LOG_FILE="/var/log/neko-watchdog.log"
        FAIL_COUNT_FILE="/tmp/neko_fail_count"
        
        IS_HEALTHY=false
        
        if docker inspect -f '{{.State.Running}}' neko 2>/dev/null | grep -q "true"; then
            if command -v curl &> /dev/null; then
                HTTP_CODE=$$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 http://127.0.0.1:48911)
                if [ "$$HTTP_CODE" = "200" ] || [ "$$HTTP_CODE" = "302" ] || [ "$$HTTP_CODE" = "403" ]; then
                    IS_HEALTHY=true
                fi
            else
                if timeout 3 bash -c "echo > /dev/tcp/127.0.0.1/48911" 2>/dev/null; then
                    IS_HEALTHY=true
                fi
            fi
        fi
        
        if [ "$$IS_HEALTHY" = true ]; then
            rm -f $$FAIL_COUNT_FILE
            exit 0
        fi
        
        FAIL_COUNT=$$(cat $$FAIL_COUNT_FILE 2>/dev/null || echo 0)
        FAIL_COUNT=$$((FAIL_COUNT + 1))
        echo $$FAIL_COUNT > $$FAIL_COUNT_FILE
        echo "$$(date '+%Y-%m-%d %H:%M:%S') - 健康检查失败，连续失败次数: $$FAIL_COUNT" >> $$LOG_FILE
        
        if [ "$$FAIL_COUNT" -ge 2 ]; then
            echo "$$(date '+%Y-%m-%d %H:%M:%S') - 连续2次失败，正在尝试重启容器..." >> $$LOG_FILE
            if docker restart neko >> $$LOG_FILE 2>&1; then
                echo "$$(date '+%Y-%m-%d %H:%M:%S') - 重启成功，计数器清零。" >> $$LOG_FILE
                rm -f $$FAIL_COUNT_FILE
            else
                echo "$$(date '+%Y-%m-%d %H:%M:%S') - 重启失败！请检查 Docker socket 权限。" >> $$LOG_FILE
            fi
        fi
        WATCHDOG_EOF
        chmod +x /host-opt/neko/watchdog.sh
        
        cat > /host-cron.d/neko-watchdog <<'CRON_EOF'
        */5 * * * * root /opt/neko/watchdog.sh
        CRON_EOF
        chown root:root /host-cron.d/neko-watchdog
        chmod 644 /host-cron.d/neko-watchdog
        echo "已安装高强度看门狗到 /opt/neko/watchdog.sh"
    volumes:
      - /etc/cron.d:/host-cron.d
      - /opt:/host-opt
    networks:
      - neko-network

networks:
  neko-network:
    driver: bridge
