<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="ui.title">一言 · Hitokoto</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f1e8;
      --paper-deep: #eee3d5;
      --ink: #263238;
      --muted: #6e7473;
      --line: rgba(74, 63, 54, 0.17);
      --wine: #8c3f4f;
      --wine-dark: #682b39;
      --moss: #66735a;
      --gold: #c29455;
      --success: #35664a;
      --danger: #9c3f3f;
      --shadow: 0 20px 55px rgba(68, 52, 43, 0.13);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px 48px;
      background:
        radial-gradient(circle at 12% 8%, rgba(194, 148, 85, 0.22), transparent 28rem),
        radial-gradient(circle at 92% 18%, rgba(140, 63, 79, 0.14), transparent 25rem),
        linear-gradient(145deg, var(--paper) 0%, #faf6ef 45%, var(--paper-deep) 100%);
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 28px,
          rgba(77, 62, 49, 0.025) 29px
        );
      content: "";
      pointer-events: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select,
    input {
      min-height: 44px;
    }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(140, 63, 79, 0.28);
      outline-offset: 2px;
    }

    .shell {
      width: min(1080px, 100%);
      margin: 0 auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(30px, 6vw, 64px);
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 32px;
      background:
        linear-gradient(125deg, rgba(255, 255, 255, 0.8), rgba(250, 243, 233, 0.68)),
        var(--paper);
      box-shadow: var(--shadow);
    }

    .hero::after {
      position: absolute;
      right: -45px;
      bottom: -75px;
      width: 240px;
      height: 240px;
      border: 1px solid rgba(140, 63, 79, 0.13);
      border-radius: 50%;
      box-shadow:
        0 0 0 28px rgba(140, 63, 79, 0.045),
        0 0 0 56px rgba(140, 63, 79, 0.025);
      content: "";
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      color: var(--wine);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.76rem;
      font-weight: 750;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 34px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 5rem);
      font-weight: 650;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .hero p {
      max-width: 610px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.8;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 22px 0;
    }

    .status-card {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(10px);
    }

    .status-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-value {
      display: block;
      overflow: hidden;
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #latestStatus {
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .status-value[data-tone="ok"] {
      color: var(--success);
    }

    .status-value[data-tone="error"] {
      color: var(--danger);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.14fr) minmax(320px, 0.86fr);
      gap: 22px;
      align-items: start;
    }

    .panel {
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.66);
      box-shadow: 0 14px 40px rgba(68, 52, 43, 0.09);
      backdrop-filter: blur(12px);
    }

    .quote-panel {
      position: relative;
      min-height: 445px;
      overflow: hidden;
      padding: clamp(28px, 5vw, 48px);
    }

    .quote-panel::before {
      position: absolute;
      top: 12px;
      left: 22px;
      color: rgba(140, 63, 79, 0.13);
      content: "“";
      font-family: Georgia, serif;
      font-size: 9rem;
      line-height: 1;
      pointer-events: none;
    }

    .quote-kicker {
      position: relative;
      z-index: 1;
      margin: 0 0 30px;
      color: var(--wine);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .quote-text {
      position: relative;
      z-index: 1;
      min-height: 120px;
      margin: 0;
      font-size: clamp(1.55rem, 4vw, 2.55rem);
      font-weight: 580;
      letter-spacing: 0.01em;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .quote-source {
      position: relative;
      z-index: 1;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .quote-meta {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 28px;
      margin-top: 24px;
      flex-wrap: wrap;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.78rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid rgba(102, 115, 90, 0.26);
      border-radius: 999px;
      background: rgba(102, 115, 90, 0.1);
      color: var(--moss);
      font-weight: 750;
    }

    .pill[hidden] {
      display: none !important;
    }

    .trace-link {
      color: var(--wine);
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .quote-actions,
    .settings-actions {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 10px;
      margin-top: 34px;
      flex-wrap: wrap;
    }

    .settings-panel {
      padding: 28px;
    }

    .section-title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
    }

    .section-description {
      margin: 8px 0 24px;
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .field {
      margin: 0 0 19px;
    }

    .field > label {
      display: block;
      margin-bottom: 8px;
      color: #3e4546;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.84rem;
      font-weight: 720;
    }

    .field input[type="number"],
    .field select {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .field input[type="number"]:hover,
    .field select:hover {
      border-color: rgba(140, 63, 79, 0.4);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 58px;
      padding: 11px 0;
      border-top: 1px solid var(--line);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.88rem;
      font-weight: 680;
      line-height: 1.4;
    }

    .toggle-row input {
      width: 22px;
      min-width: 22px;
      height: 22px;
      min-height: 22px;
      accent-color: var(--wine);
      cursor: pointer;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 17px;
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.86rem;
      font-weight: 760;
      line-height: 1.15;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .button:active:not(:disabled) {
      transform: translateY(0);
    }

    .button-primary {
      background: var(--wine);
      color: #fffaf4;
      box-shadow: 0 8px 18px rgba(140, 63, 79, 0.2);
    }

    .button-primary:hover:not(:disabled) {
      background: var(--wine-dark);
      box-shadow: 0 11px 23px rgba(140, 63, 79, 0.27);
    }

    .button-secondary {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink);
    }

    .button-quiet {
      border-color: rgba(140, 63, 79, 0.2);
      background: rgba(140, 63, 79, 0.07);
      color: var(--wine-dark);
    }

    .button:disabled,
    input:disabled,
    select:disabled {
      cursor: wait;
      opacity: 0.52;
    }

    .message {
      display: flex;
      align-items: center;
      min-height: 48px;
      margin: 22px 0 0;
      padding: 12px 16px;
      border: 1px solid rgba(194, 148, 85, 0.26);
      border-radius: 14px;
      background: rgba(194, 148, 85, 0.09);
      color: #675136;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.86rem;
      font-weight: 650;
      line-height: 1.45;
    }

    .message[data-tone="success"] {
      border-color: rgba(53, 102, 74, 0.24);
      background: rgba(53, 102, 74, 0.08);
      color: var(--success);
    }

    .message[data-tone="error"] {
      border-color: rgba(156, 63, 63, 0.25);
      background: rgba(156, 63, 63, 0.08);
      color: var(--danger);
    }

    @media (max-width: 820px) {
      .status-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .quote-panel {
        min-height: 390px;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 14px 10px 30px;
      }

      .hero {
        padding: 28px 22px;
        border-radius: 24px;
      }

      .status-grid {
        gap: 8px;
        margin: 14px 0;
      }

      .status-card {
        padding: 14px 12px;
      }

      .quote-panel,
      .settings-panel {
        padding: 24px 20px;
      }

      .quote-actions,
      .settings-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell" aria-busy="true" id="appRoot">
    <header class="hero">
      <div class="eyebrow">N.E.K.O · HITOKOTO</div>
      <h1 data-i18n="ui.title" data-testid="plugin-title">一言 · Hitokoto</h1>
      <p data-i18n="ui.subtitle" data-testid="plugin-description">
        随机或按日获取一句话，按喜爱的类型筛选，也可让角色在每天首次聊天时自然分享。
      </p>
    </header>

    <section
      class="status-grid"
      aria-label="Plugin status"
      data-i18n-aria-label="ui.status.group"
    >
      <article class="status-card">
        <span class="status-label" data-i18n="ui.status.running">运行状态</span>
        <span class="status-value" id="runningStatus" data-testid="running-status">—</span>
      </article>
      <article class="status-card">
        <span class="status-label" data-i18n="ui.status.api">API 状态</span>
        <span class="status-value" id="apiStatus" data-testid="api-status">—</span>
      </article>
      <article class="status-card">
        <span class="status-label" data-i18n="ui.status.latest">最近请求</span>
        <span class="status-value" id="latestStatus" data-testid="latest-request">—</span>
      </article>
      <article class="status-card">
        <span class="status-label" data-i18n="ui.status.cache_date">每日缓存日期</span>
        <span class="status-value" id="cacheDate" data-testid="cache-date">—</span>
      </article>
    </section>

    <section class="layout">
      <article class="panel quote-panel" aria-labelledby="quoteHeading">
        <p class="quote-kicker" id="quoteHeading" data-i18n="ui.quote.recent">最近的一言</p>
        <blockquote
          class="quote-text"
          id="quoteText"
          data-testid="quote-preview"
          data-i18n="ui.quote.empty"
        >
          还没有最近的一言。点击“随机一言”开始吧。
        </blockquote>
        <p class="quote-source" id="quoteSource" data-testid="quote-source"></p>
        <div class="quote-meta">
          <span class="pill" id="quoteType" data-testid="quote-type" hidden></span>
          <a
            class="trace-link"
            id="quoteLink"
            data-testid="quote-link"
            href="https://hitokoto.cn/"
            target="_blank"
            rel="noopener noreferrer"
            hidden
            data-i18n="ui.quote.trace"
          >查看来源</a>
        </div>
        <div class="quote-actions">
          <button
            class="button button-primary"
            id="randomQuoteButton"
            type="button"
            data-action
            data-testid="random-quote-button"
            data-i18n="ui.action.random"
          >随机一言</button>
          <button
            class="button button-secondary"
            id="dailyQuoteButton"
            type="button"
            data-action
            data-testid="daily-quote-button"
            data-i18n="ui.action.daily"
          >今日一言</button>
          <button
            class="button button-secondary"
            id="testApiButton"
            type="button"
            data-action
            data-testid="test-api-button"
            data-i18n="ui.action.test"
          >测试 API</button>
        </div>
      </article>

      <aside class="panel settings-panel" aria-labelledby="settingsTitle">
        <h2 class="section-title" id="settingsTitle" data-i18n="ui.settings.title">阅读偏好</h2>
        <p class="section-description" data-i18n="ui.settings.description">
          保存后立即生效，无需重启插件。
        </p>

        <form id="settingsForm">
          <div class="field">
            <label for="defaultCategory" data-i18n="ui.settings.category">默认类型</label>
            <select id="defaultCategory" data-testid="default-category">
              <option value="" data-i18n="ui.category.all">随机 / 全部</option>
              <option value="a" data-i18n="ui.category.a">a · 动画</option>
              <option value="b" data-i18n="ui.category.b">b · 漫画</option>
              <option value="c" data-i18n="ui.category.c">c · 游戏</option>
              <option value="d" data-i18n="ui.category.d">d · 文学</option>
              <option value="e" data-i18n="ui.category.e">e · 原创</option>
              <option value="f" data-i18n="ui.category.f">f · 来自网络</option>
              <option value="g" data-i18n="ui.category.g">g · 其他</option>
              <option value="h" data-i18n="ui.category.h">h · 影视</option>
              <option value="i" data-i18n="ui.category.i">i · 诗词</option>
              <option value="j" data-i18n="ui.category.j">j · 网易云</option>
              <option value="k" data-i18n="ui.category.k">k · 哲学</option>
              <option value="l" data-i18n="ui.category.l">l · 抖机灵</option>
            </select>
          </div>

          <div class="field">
            <label for="timeoutSeconds" data-i18n="ui.settings.timeout">请求超时（秒）</label>
            <input
              id="timeoutSeconds"
              data-testid="timeout-seconds"
              type="number"
              min="1"
              max="30"
              step="0.5"
              inputmode="decimal"
              required
            >
          </div>

          <div class="field">
            <label for="maxLength" data-i18n="ui.settings.max_length">最大句长</label>
            <input
              id="maxLength"
              data-testid="max-length"
              type="number"
              min="1"
              max="200"
              step="1"
              inputmode="numeric"
              required
            >
          </div>

          <label class="toggle-row" for="dailyCache">
            <span data-i18n="ui.settings.daily_cache">启用每日一句缓存</span>
            <input id="dailyCache" data-testid="daily-cache-toggle" type="checkbox">
          </label>

          <label class="toggle-row" for="dailyGreeting">
            <span data-i18n="ui.settings.daily_greeting">每天首次聊天时自然分享</span>
            <input id="dailyGreeting" data-testid="daily-greeting-toggle" type="checkbox">
          </label>

          <div class="settings-actions">
            <button
              class="button button-primary"
              id="saveSettingsButton"
              type="submit"
              data-action
              data-testid="save-settings-button"
              data-i18n="ui.action.save"
            >保存设置</button>
            <button
              class="button button-secondary"
              id="resetSettingsButton"
              type="button"
              data-action
              data-testid="reset-settings-button"
              data-i18n="ui.action.reset"
            >恢复默认</button>
            <button
              class="button button-quiet"
              id="clearCacheButton"
              type="button"
              data-action
              data-testid="clear-cache-button"
              data-i18n="ui.action.clear"
            >清除每日缓存</button>
          </div>
        </form>
      </aside>
    </section>

    <div
      class="message"
      id="statusMessage"
      data-testid="status-message"
      data-tone="info"
      role="status"
      aria-live="polite"
    >正在读取一言插件状态…</div>
  </main>

  <script>
    "use strict";

    const PLUGIN_ID = "hitokoto";
    const RUNS_URL = "/runs";
    const SUPPORTED_LOCALES = [
      "zh-CN",
      "zh-TW",
      "en",
      "ja",
      "ko",
      "es",
      "pt",
      "ru"
    ];
    const I18N_FALLBACK = {
      "ui.quote.empty": "还没有最近的一言。点击“随机一言”开始吧。",
      "ui.loading": "正在读取一言插件状态…",
      "ui.error.generic": "操作失败",
      "ui.error.timeout": "插件调用超时。",
      "ui.error.run_id": "未获取到任务 ID。",
      "ui.error.create_run": "无法创建插件任务。",
      "ui.error.invalid_number": "请检查超时秒数和最大句长。",
      "ui.loading.action": "正在处理，请稍候…",
      "ui.success.loaded": "状态已更新。",
      "ui.success.saved": "设置已保存并立即生效。",
      "ui.success.reset": "已恢复默认设置。",
      "ui.success.random": "已取回一条随机一言。",
      "ui.success.daily": "已取回今日一言。",
      "ui.success.test": "API 测试成功。",
      "ui.success.clear": "每日缓存已清除。",
      "ui.warning.clear_persist": "已清除当前运行中的每日缓存，但无法持久保存删除结果；重启后旧缓存可能再次出现。",
      "ui.status.running_yes": "运行中",
      "ui.status.running_no": "未启动",
      "ui.status.api_idle": "尚未测试",
      "ui.status.api_ok": "连接正常",
      "ui.status.api_error": "连接异常",
      "ui.meta.never": "尚无请求",
      "ui.meta.cache_hit": "缓存命中",
      "ui.meta.fresh": "实时获取",
      "ui.meta.error": "请求失败",
      "ui.meta.pushed": "已交给角色分享",
      "ui.meta.push_error": "角色分享失败"
    };

    let translations = {};
    let busy = true;

    const element = id => document.getElementById(id);

    function translate(key, fallback) {
      return translations[key] || I18N_FALLBACK[key] || fallback || key;
    }

    function normalizeLocale(value) {
      const raw = String(value || "")
        .trim()
        .replace(/_/g, "-")
        .toLowerCase();
      const parts = raw.split("-").filter(Boolean);
      const language = parts[0] || "";
      if (language === "zh") {
        if (parts.includes("hant")) return "zh-TW";
        if (parts.includes("hans")) return "zh-CN";
        return parts.some(part => ["tw", "hk", "mo"].includes(part))
          ? "zh-TW"
          : "zh-CN";
      }
      return ["en", "ja", "ko", "es", "pt", "ru"].includes(language)
        ? language
        : "";
    }

    async function loadI18n() {
      let savedLocale = "";
      try {
        savedLocale = localStorage.getItem("locale") || "";
      } catch (_error) {
        savedLocale = "";
      }
      let requested = normalizeLocale(
        new URLSearchParams(location.search).get("locale")
      ) || normalizeLocale(savedLocale);
      if (!requested) {
        try {
          const response = await fetch(`/plugin/${PLUGIN_ID}/ui-api/locale`);
          if (response.ok) {
            const payload = await response.json();
            requested = normalizeLocale(payload.locale || payload.language);
          }
        } catch (_error) {
          // The panel remains fully usable with its built-in Chinese labels.
        }
      }
      requested = requested || normalizeLocale(navigator.language) || "zh-CN";

      const candidates = [
        requested,
        "zh-CN",
        "en"
      ].filter((value, index, values) =>
        value && SUPPORTED_LOCALES.includes(value) && values.indexOf(value) === index
      );

      for (const locale of candidates) {
        try {
          const response = await fetch(
            `/plugin/${PLUGIN_ID}/ui-api/i18n/${locale}.json`
          );
          if (!response.ok) continue;
          translations = await response.json();
          document.documentElement.lang = locale;
          return;
        } catch (_error) {
          // Try the next local bundle.
        }
      }
    }

    function applyI18n() {
      document.querySelectorAll("[data-i18n]").forEach(node => {
        const key = node.getAttribute("data-i18n");
        node.textContent = translate(key, node.textContent);
      });
      document.querySelectorAll("[data-i18n-aria-label]").forEach(node => {
        const key = node.getAttribute("data-i18n-aria-label");
        node.setAttribute(
          "aria-label",
          translate(key, node.getAttribute("aria-label") || "")
        );
      });
    }

    function pluginError(payload) {
      if (!payload) return translate("ui.error.generic");
      if (typeof payload.error === "string") return payload.error;
      if (payload.error && payload.error.message) return payload.error.message;
      if (payload.message) return payload.message;
      return translate("ui.error.generic");
    }

    async function callPlugin(entryId, args = {}) {
      const createResponse = await fetch(RUNS_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          plugin_id: PLUGIN_ID,
          entry_id: entryId,
          args
        })
      });
      if (!createResponse.ok) {
        throw new Error(
          `${translate("ui.error.create_run")} (HTTP ${createResponse.status})`
        );
      }

      const created = await createResponse.json();
      const runId = created.run_id || created.id;
      if (!runId) throw new Error(translate("ui.error.run_id"));

      const deadline = Date.now() + 40000;
      while (Date.now() < deadline) {
        await new Promise(resolve => window.setTimeout(resolve, 250));
        const pollResponse = await fetch(`${RUNS_URL}/${runId}`);
        if (!pollResponse.ok) continue;
        const run = await pollResponse.json();
        if (run.status === "succeeded") {
          const exportResponse = await fetch(`${RUNS_URL}/${runId}/export`);
          if (!exportResponse.ok) {
            throw new Error(`${translate("ui.error.generic")} (export)`);
          }
          const exported = await exportResponse.json();
          const items = Array.isArray(exported.items) ? exported.items : [];
          const item = items.find(candidate =>
            candidate && candidate.type === "json" && candidate.json
          ) || items[0];
          const response = item && item.json ? item.json : {};
          if (response.success === false || response.error) {
            throw new Error(pluginError(response));
          }
          return response.data || {};
        }
        if (["failed", "canceled", "timeout"].includes(run.status)) {
          const message = run.error && run.error.message
            ? run.error.message
            : (run.message || run.status);
          throw new Error(message);
        }
      }
      throw new Error(translate("ui.error.timeout"));
    }

    function setMessage(text, tone = "info") {
      const message = element("statusMessage");
      message.textContent = String(text || "");
      message.dataset.tone = tone;
    }

    function setBusy(nextBusy, text) {
      busy = Boolean(nextBusy);
      element("appRoot").setAttribute("aria-busy", String(busy));
      document.querySelectorAll("[data-action], input, select").forEach(control => {
        control.disabled = busy;
      });
      if (text) setMessage(text, "info");
    }

    function setQuote(quote) {
      const sentence = quote && typeof quote.sentence === "string"
        ? quote.sentence.trim()
        : "";
      const source = quote && typeof quote.source === "string"
        ? quote.source.trim()
        : "";
      const typeLabel = quote && typeof quote.type_label === "string"
        ? quote.type_label.trim()
        : "";
      const typeCode = quote && typeof quote.type_code === "string"
        ? quote.type_code.trim()
        : "";
      const traceUrl = quote && typeof quote.url === "string"
        ? quote.url.trim()
        : "";

      element("quoteText").textContent = sentence || translate("ui.quote.empty");
      element("quoteSource").textContent = source ? `—— ${source}` : "";

      const typeNode = element("quoteType");
      typeNode.textContent = typeCode
        ? translate(`ui.category.${typeCode}`, typeLabel)
        : typeLabel;
      typeNode.hidden = !typeNode.textContent;

      const link = element("quoteLink");
      let safeTrace = "";
      try {
        const parsedTrace = new URL(traceUrl);
        if (
          parsedTrace.protocol === "https:" &&
          parsedTrace.hostname === "hitokoto.cn"
        ) {
          safeTrace = parsedTrace.href;
        }
      } catch (_error) {
        safeTrace = "";
      }
      link.href = safeTrace || "https://hitokoto.cn/";
      link.hidden = !safeTrace;
    }

    function setSettings(settings) {
      if (!settings) return;
      element("defaultCategory").value =
        typeof settings.default_category === "string"
          ? settings.default_category
          : "";
      element("timeoutSeconds").value = String(settings.timeout_seconds ?? 10);
      element("maxLength").value = String(settings.max_length ?? 80);
      element("dailyCache").checked = Boolean(settings.daily_cache);
      element("dailyGreeting").checked = Boolean(settings.daily_greeting);
    }

    function apiLabel(state) {
      if (state === "ok") return translate("ui.status.api_ok");
      if (state === "error") return translate("ui.status.api_error");
      return translate("ui.status.api_idle");
    }

    function latestLabel(latest) {
      if (!latest || latest.status === "not_requested") {
        return translate("ui.meta.never");
      }
      const statusKeys = {
        cache_hit: "ui.meta.cache_hit",
        success: "ui.meta.fresh",
        error: "ui.meta.error",
        pushed: "ui.meta.pushed",
        push_error: "ui.meta.push_error"
      };
      const status = statusKeys[latest.status]
        ? translate(statusKeys[latest.status], latest.status)
        : latest.status;
      const when = latest.time ? new Date(latest.time).toLocaleString() : "";
      return [status, when].filter(Boolean).join(" · ");
    }

    function renderState(state) {
      const running = element("runningStatus");
      running.textContent = state.running
        ? translate("ui.status.running_yes")
        : translate("ui.status.running_no");
      running.dataset.tone = state.running ? "ok" : "error";

      const api = element("apiStatus");
      api.textContent = apiLabel(state.api_state);
      api.dataset.tone = state.api_state === "ok"
        ? "ok"
        : (state.api_state === "error" ? "error" : "");

      element("latestStatus").textContent = latestLabel(state.latest_request);
      element("cacheDate").textContent =
        state.daily_cache && state.daily_cache.date
          ? state.daily_cache.date
          : "—";
      setSettings(state.settings);
      setQuote(state.recent_quote);
    }

    async function refreshState(showSuccess = false) {
      const state = await callPlugin("get_panel_state");
      renderState(state);
      if (showSuccess) setMessage(translate("ui.success.loaded"), "success");
      return state;
    }

    async function runAction(task, successMessage) {
      if (busy) return;
      setBusy(true, translate("ui.loading.action"));
      try {
        const result = await task();
        if (successMessage) setMessage(translate(successMessage), "success");
        return result;
      } catch (error) {
        setMessage(
          error && error.message ? error.message : translate("ui.error.generic"),
          "error"
        );
        return null;
      } finally {
        setBusy(false);
      }
    }

    element("settingsForm").addEventListener("submit", event => {
      event.preventDefault();
      if (!event.currentTarget.checkValidity()) {
        const invalidIds = Array.from(
          event.currentTarget.querySelectorAll(":invalid"),
          control => control.id
        ).filter(Boolean);
        console.warn(invalidIds);
        if (typeof event.currentTarget.reportValidity === "function") {
          event.currentTarget.reportValidity();
        }
        setMessage(translate("ui.error.invalid_number"), "error");
        return;
      }
      void runAction(async () => {
        const timeoutText = element("timeoutSeconds").value.trim();
        const maxLengthText = element("maxLength").value.trim();
        if (!timeoutText || !maxLengthText) {
          throw new Error(translate("ui.error.invalid_number"));
        }
        const timeoutRaw = Number(timeoutText);
        const maxLengthRaw = Number(maxLengthText);
        if (
          !Number.isFinite(timeoutRaw) ||
          !Number.isFinite(maxLengthRaw) ||
          !Number.isInteger(maxLengthRaw)
        ) {
          throw new Error(translate("ui.error.invalid_number"));
        }
        const result = await callPlugin("save_settings", {
          default_category: element("defaultCategory").value,
          timeout_seconds: timeoutRaw,
          max_length: maxLengthRaw,
          daily_cache: element("dailyCache").checked,
          daily_greeting: element("dailyGreeting").checked
        });
        setSettings(result.settings);
        await refreshState(false);
        return result;
      }, "ui.success.saved");
    });

    element("resetSettingsButton").addEventListener("click", () => {
      void runAction(async () => {
        const result = await callPlugin("reset_settings");
        setSettings(result.settings);
        await refreshState(false);
        return result;
      }, "ui.success.reset");
    });

    element("randomQuoteButton").addEventListener("click", () => {
      void runAction(async () => {
        const result = await callPlugin("random_quote", {
          category: element("defaultCategory").value
        });
        setQuote(result);
        await refreshState(false);
        return result;
      }, "ui.success.random");
    });

    element("dailyQuoteButton").addEventListener("click", () => {
      void runAction(async () => {
        const result = await callPlugin("daily_quote");
        setQuote(result);
        await refreshState(false);
        return result;
      }, "ui.success.daily");
    });

    element("testApiButton").addEventListener("click", () => {
      void runAction(async () => {
        const result = await callPlugin("test_api");
        setQuote(result.quote);
        await refreshState(false);
        return result;
      }, "ui.success.test");
    });

    element("clearCacheButton").addEventListener("click", () => {
      void runAction(async () => {
        const result = await callPlugin("clear_daily_cache");
        const state = await refreshState(false);
        const persistenceWarning =
          result.persisted === false && state.store_enabled === true;
        setMessage(
          translate(
            persistenceWarning
              ? "ui.warning.clear_persist"
              : "ui.success.clear"
          ),
          persistenceWarning ? "warning" : "success"
        );
        return result;
      });
    });

    setBusy(true, I18N_FALLBACK["ui.loading"] || "正在读取一言插件状态…");

    document.addEventListener("DOMContentLoaded", async () => {
      setMessage(translate("ui.loading"), "info");
      try {
        await loadI18n();
        applyI18n();
        setMessage(translate("ui.loading"), "info");
        await refreshState(false);
        setMessage(translate("ui.success.loaded"), "success");
      } catch (error) {
        setMessage(
          error && error.message ? error.message : translate("ui.error.generic"),
          "error"
        );
      } finally {
        setBusy(false);
      }
    });
  </script>
</body>
</html>
