[plugin]
name = "Claude 伙伴陪伴"
description = "监测 Claude Code 工作活动，让 NEKO 伙伴温暖陪伴你开发。Web UI：http://127.0.0.1:48916/plugin/claude_companion/ui/"
short_description = "Monitors Claude Code activity and lets your NEKO companion encourage you while coding."
keywords = ["claude", "companion", "陪伴", "开发", "coding", "鼓励", "monitor", "activity"]
version = "1.0.0"
id = "claude_companion"
entry = "plugin.plugins.claude_companion:ClaudeCompanionPlugin"

[plugin.author]
name = "NEKO Community"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = false

# Permissions this plugin needs from the user (see docs/plugins/plugin-toml.md).
[permissions.require."system.fs:read"]
reason = { zh-CN = "读取 Claude Code 的对话记录，了解它刚刚做了什么。", zh-TW = "讀取 Claude Code 的對話紀錄，了解它剛剛做了什麼。", en = "Read Claude Code's conversation logs to see what it just did.", ja = "Claude Code の会話ログを読み取り、直前に何をしたかを把握します。", ko = "Claude Code의 대화 기록을 읽어 방금 무엇을 했는지 파악합니다.", ru = "Читать журналы диалогов Claude Code, чтобы узнать, что он только что сделал.", es = "Leer los registros de conversación de Claude Code para saber qué acaba de hacer.", pt = "Ler os registros de conversa do Claude Code para saber o que ele acabou de fazer." }

[permissions.require."plugin_sdk.main_agent.messages:push"]
reason = { zh-CN = "把 Claude Code 的工作进展告诉 N.E.K.O。", zh-TW = "把 Claude Code 的工作進度告訴 N.E.K.O。", en = "Tell N.E.K.O how Claude Code's work is going.", ja = "Claude Code の作業の進み具合を N.E.K.O に伝えます。", ko = "Claude Code의 작업 진행 상황을 N.E.K.O에게 알립니다.", ru = "Сообщать N.E.K.O, как продвигается работа Claude Code.", es = "Contarle a N.E.K.O cómo avanza el trabajo de Claude Code.", pt = "Contar ao N.E.K.O como está o trabalho do Claude Code." }

[permissions.require."system.env:read"]
reason = { zh-CN = "从环境变量读取运行配置。", zh-TW = "從環境變數讀取執行設定。", en = "Read its runtime settings from environment variables.", ja = "環境変数から実行時の設定を読み取ります。", ko = "환경 변수에서 실행 설정을 읽습니다.", ru = "Читать настройки работы из переменных окружения.", es = "Leer su configuración de ejecución desde variables de entorno.", pt = "Ler as configurações de execução a partir de variáveis de ambiente." }
