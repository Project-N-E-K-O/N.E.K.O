[plugin]
name = "B站集成"
description = "接入 B站私信、评论回复与 @ 通知，并自动生成对应回复。"
short_description = "B站私信与评论通知自动回复，支持白名单。"
keywords = ["bilibili", "b站", "私信", "评论", "@", "dm"]
passive = true
version = "1.2.0"
id = "bilibili_dm"
type = "plugin"
entry = "plugin.plugins.bilibili_dm:BiliDMPlugin"

[plugin.author]
name = "xxynet"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "B站集成"
entry = "static/index.html"
context = "bilibili_dm"
permissions = ["state:read", "action:call"]

[[plugin.ui.guide]]
id = "quickstart"
title = "快速开始"
entry = "README.md"
permissions = ["state:read"]

[plugin_runtime]
enabled = true
auto_start = false
