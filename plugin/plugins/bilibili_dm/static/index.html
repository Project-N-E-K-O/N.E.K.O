<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.title">B站集成</title>
    <link rel="stylesheet" href="./style.css?v=1.2.2">
</head>
<body>
    <main class="app-container">
        <header class="hero">
            <div>
                <p class="eyebrow">N.E.K.O · BILIBILI</p>
                <h1 data-i18n="page.title">B站集成</h1>
                <p class="subtitle" data-i18n="ui.subtitle">在本机保存登录 Cookie，控制私信、评论回复和 @ 通知的自动回复。</p>
            </div>
            <button id="btn-refresh" class="button secondary" type="button" data-i18n="ui.actions.refresh">刷新状态</button>
        </header>

        <section class="card status-card">
            <div class="section-head">
                <div>
                    <p class="section-kicker" data-i18n="ui.section.runtime">RUNTIME</p>
                    <h2 data-i18n="panel.status.title">插件状态</h2>
                </div>
                <span id="listener-status" class="pill idle" data-i18n="ui.status.stopped">已停止</span>
            </div>
            <p id="credential-summary" class="hint" data-i18n="ui.credentials.summary_initial">尚未完整配置 SESSDATA 和 bili_jct。</p>
            <div class="actions">
                <button id="btn-start" class="button primary" type="button" data-i18n="ui.actions.start">开始监听</button>
                <button id="btn-stop" class="button danger" type="button" hidden data-i18n="ui.actions.stop">停止监听</button>
            </div>
        </section>

        <section class="card">
            <div class="section-head">
                <div>
                    <p class="section-kicker" data-i18n="ui.section.credentials">CREDENTIALS</p>
                    <h2 data-i18n="panel.config.title">登录凭据</h2>
                </div>
                <span id="credential-pill" class="pill idle" data-i18n="ui.status.not_configured">未配置</span>
            </div>
            <p class="hint" data-i18n="ui.credentials.hint">可扫码一键获取配置，或从已登录 bilibili.com 的浏览器 Cookie 中复制。留空的输入框不会覆盖已经保存的值。</p>
            <div class="actions qr-actions">
                <button id="btn-qr-login" class="button secondary" type="button" data-i18n="ui.qr.start">扫码一键获取配置</button>
            </div>
            <div id="qr-login-panel" class="qr-login-panel" hidden>
                <img id="qr-login-image" class="qr-login-image" alt="B站登录二维码" data-i18n-alt="ui.qr.image_alt">
                <div class="qr-login-details">
                    <strong data-i18n="ui.qr.scan_hint">请使用 B站 App 扫码登录</strong>
                    <span id="qr-login-status">正在获取二维码…</span>
                    <span id="qr-login-countdown"></span>
                    <div class="qr-login-buttons">
                        <button id="btn-qr-refresh" class="link-button" type="button" data-i18n="ui.qr.refresh">刷新二维码</button>
                        <button id="btn-qr-cancel" class="link-button cancel" type="button" data-i18n="ui.actions.cancel">取消</button>
                    </div>
                </div>
            </div>
            <div class="credential-grid">
                <label class="field full">
                    <span data-i18n="config.sesdata_label">SESSDATA</span>
                    <input id="cfg-sesdata" type="password" autocomplete="off" spellcheck="false" placeholder="必填" data-i18n-placeholder="ui.credentials.required">
                    <small id="state-sesdata" data-i18n="ui.credentials.not_saved">未保存</small>
                </label>
                <label class="field">
                    <span data-i18n="config.bili_jct_label">bili_jct</span>
                    <input id="cfg-bili-jct" type="password" autocomplete="off" spellcheck="false" placeholder="必填" data-i18n-placeholder="ui.credentials.required">
                    <small id="state-bili-jct" data-i18n="ui.credentials.not_saved">未保存</small>
                </label>
                <label class="field">
                    <span data-i18n="config.buvid3_label">buvid3</span>
                    <input id="cfg-buvid3" type="password" autocomplete="off" spellcheck="false">
                    <small id="state-buvid3" data-i18n="ui.credentials.not_saved">未保存</small>
                </label>
                <label class="field">
                    <span data-i18n="config.dedeuserid_label">DedeUserID</span>
                    <input id="cfg-dedeuserid" type="password" autocomplete="off" spellcheck="false">
                    <small id="state-dedeuserid" data-i18n="ui.credentials.not_saved">未保存</small>
                </label>
                <label class="field">
                    <span data-i18n="config.ac_time_value_label">ac_time_value</span>
                    <input id="cfg-ac-time-value" type="password" autocomplete="off" spellcheck="false">
                    <small id="state-ac-time-value" data-i18n="ui.credentials.not_saved">未保存</small>
                </label>
            </div>

            <div class="divider"></div>

            <div class="settings-grid">
                <label class="field">
                    <span data-i18n="ai.permission_mode_label">权限模式</span>
                    <select id="cfg-permission-mode">
                        <option value="allow_list" data-i18n="ui.permission.allow_list">allow_list · 仅白名单</option>
                        <option value="deny_list" data-i18n="ui.permission.deny_list">deny_list · 排除普通用户</option>
                        <option value="open" data-i18n="ui.permission.open">open · 所有人</option>
                    </select>
                </label>
                <label class="field">
                    <span data-i18n="ui.settings.max_concurrent">最大并发消息</span>
                    <input id="cfg-max-concurrent" type="number" min="1" max="20" value="3">
                </label>
                <label class="field">
                    <span data-i18n="ui.settings.connect_timeout">AI 连接超时（秒）</span>
                    <input id="cfg-connect-timeout" type="number" min="1" max="120" step="1" value="10">
                </label>
                <label class="field">
                    <span data-i18n="ui.settings.turn_timeout">单轮回复超时（秒）</span>
                    <input id="cfg-turn-timeout" type="number" min="5" max="600" step="1" value="60">
                </label>
                <label class="field">
                    <span data-i18n="config.comment_notifications_label">评论回复与 @ 通知</span>
                    <select id="cfg-comment-notifications">
                        <option value="true" data-i18n="config.enabled">启用</option>
                        <option value="false" data-i18n="config.disabled">停用</option>
                    </select>
                </label>
                <label class="field">
                    <span data-i18n="config.notification_poll_interval_label">通知轮询间隔（秒）</span>
                    <input id="cfg-notification-poll-interval" type="number" min="5" max="300" step="1" value="20">
                </label>
                <label class="field">
                    <span data-i18n="config.notification_max_items_label">每轮处理通知数</span>
                    <input id="cfg-notification-max-items" type="number" min="1" max="50" step="1" value="20">
                </label>
            </div>

            <div class="actions split">
                <button id="btn-clear" class="button danger-ghost" type="button" data-i18n="ui.actions.clear_credentials">清除本地凭据</button>
                <button id="btn-save" class="button primary" type="button" data-i18n="ui.actions.save">保存配置</button>
            </div>
        </section>

        <section class="card">
            <div class="section-head">
                <div>
                    <p class="section-kicker" data-i18n="ui.section.access">ACCESS</p>
                    <h2 data-i18n="panel.users.title">信任用户管理</h2>
                </div>
                <span id="trusted-count" class="pill" data-i18n="ui.users.count" data-i18n-count="0">0 人</span>
            </div>
            <p class="hint" data-i18n="ui.users.hint">默认“仅白名单”模式下，只有这里配置的用户能触发私信、评论回复和 @ 通知的自动回复。</p>
            <div class="user-form">
                <input id="user-uid" type="text" inputmode="numeric" placeholder="B站 UID" data-i18n-placeholder="ui.users.uid_placeholder">
                <input id="user-nickname" type="text" placeholder="昵称（可选）" data-i18n-placeholder="ui.users.nickname_placeholder">
                <select id="user-level">
                    <option value="trusted" data-i18n="ui.users.level.trusted">信任用户</option>
                    <option value="admin" data-i18n="ui.users.level.admin">管理员</option>
                    <option value="normal" data-i18n="ui.users.level.normal">普通用户</option>
                </select>
                <button id="btn-add-user" class="button secondary" type="button" data-i18n="ui.actions.add">添加</button>
            </div>
            <div id="trusted-users" class="user-list"></div>
        </section>
    </main>

    <div id="toast" class="toast" role="status"></div>
    <script src="./i18n.js?v=1.2.2"></script>
    <script src="./script.js?v=1.2.2"></script>
</body>
</html>
