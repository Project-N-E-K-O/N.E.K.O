[plugin]
id = "lifekit"
name = "生活助手"
description = "基于地理位置的多功能生活服务。天气查询、逐小时预报、出行建议、路线规划、常用地点管理、附近 POI 搜索。"
short_description = "Location-based life services: weather, forecasts, travel advice, route planning, saved locations, nearby POI search."
keywords = ["天气", "weather", "出行", "travel", "温度", "temperature", "预报", "forecast", "穿衣", "下雨", "rain", "紫外线", "UV", "附近", "nearby", "路线", "route", "地点", "location", "美食", "food", "菜谱", "recipe", "做菜", "cooking", "空气", "air", "PM2.5", "AQI", "汇率", "currency", "换算", "convert", "倒计时", "countdown", "纪念日", "单位", "unit", "생활", "生活", "날씨", "天気"]
version = "0.3.0"
entry = "plugin.plugins.lifekit:LifeKitPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.i18n]
default_locale = "en"
locales_dir = "locales"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "生活助手"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = [
    "state:read",
    "config:read",
    "action:call",
]

[[plugin.ui.guide]]
id = "quickstart"
title = "生活助手教程"
entry = "docs/quickstart.tsx"
context = "dashboard"
permissions = [
    "state:read",
]

[plugin_runtime]
enabled = true
auto_start = false

[plugin.store]
enabled = true

[lifekit]
# 默认城市（留空则 IP 自动定位）
default_city = ""
# 预报天数 (1-7)
forecast_days = 3
# 缓存有效期（秒）
cache_ttl_seconds = 1800
# 用户时区
timezone = "Asia/Shanghai"
# 语言（留空则从主干获取用户语言，再 fallback 到系统时区自动检测）
# 支持: zh-CN, zh-TW, en, ja, ko, ru, es, pt
locale = ""
# 强制使用上面的 locale，忽略主干下发的语言（默认关闭）
force_locale = false
# 是否允许通过 IP 自动定位
enable_geoip = true

# 路线规划 API Key（至少配一个才能用公交/地铁路线）
# 不配 key 也能用 OSRM（步行/骑行/驾车，无公交）
# 高德地图: https://console.amap.com/dev/key/app
amap_key = ""
# 百度地图: https://lbsyun.baidu.com/apiconsole/key
baidu_map_key = ""

# Permissions this plugin needs from the user (see docs/plugins/plugin-toml.md).
[permissions.require."system.network:connect"]
reason = { zh-CN = "从在线服务查询天气、地图、路线、汇率等实时信息。", zh-TW = "從線上服務查詢天氣、地圖、路線、匯率等即時資訊。", en = "Look up weather, maps, routes, exchange rates and other live information from online services.", ja = "オンラインサービスから天気・地図・ルート・為替レートなどの最新情報を取得します。", ko = "온라인 서비스에서 날씨, 지도, 경로, 환율 등 실시간 정보를 조회합니다.", ru = "Получать из онлайн-сервисов погоду, карты, маршруты, курсы валют и другие актуальные данные.", es = "Consultar en servicios en línea el clima, mapas, rutas, tipos de cambio y otra información actual.", pt = "Consultar em serviços online o clima, mapas, rotas, câmbio e outras informações atualizadas." }

[permissions.require."system.env:read"]
reason = { zh-CN = "读取系统时区设置，用来显示当地时间。", zh-TW = "讀取系統時區設定，用來顯示當地時間。", en = "Read your system time zone setting to show local times.", ja = "現地時刻を表示するため、システムのタイムゾーン設定を読み取ります。", ko = "현지 시간을 표시하기 위해 시스템 시간대 설정을 읽습니다.", ru = "Читать системный часовой пояс, чтобы показывать местное время.", es = "Leer la zona horaria del sistema para mostrar la hora local.", pt = "Ler o fuso horário do sistema para mostrar o horário local." }

[permissions.require."system.fs:read"]
reason = { zh-CN = "读取系统的时区文件，用来显示当地时间。", zh-TW = "讀取系統的時區檔案，用來顯示當地時間。", en = "Read your system's time zone file to show local times.", ja = "現地時刻を表示するため、システムのタイムゾーンファイルを読み取ります。", ko = "현지 시간을 표시하기 위해 시스템의 시간대 파일을 읽습니다.", ru = "Читать системный файл часового пояса, чтобы показывать местное время.", es = "Leer el archivo de zona horaria del sistema para mostrar la hora local.", pt = "Ler o arquivo de fuso horário do sistema para mostrar o horário local." }

[permissions.ask."plugin_sdk.main_agent.messages:push"]
reason = { zh-CN = "把查询结果以卡片形式显示在对话里。", zh-TW = "把查詢結果以卡片形式顯示在對話裡。", en = "Show the results as cards in the chat.", ja = "調べた結果をカードとして会話に表示します。", ko = "조회 결과를 대화에 카드로 표시합니다.", ru = "Показывать результаты карточками в чате.", es = "Mostrar los resultados como tarjetas en el chat.", pt = "Mostrar os resultados como cartões no chat." }
