[plugin]
id = "jukebox_controller"
name = "点歌台控制器"
description = "让猫娘通过本地点歌台播放指定曲目、切歌或停止播放。"
short_description = "Control the local jukebox from chat."
keywords = ["点歌台", "点歌", "播放", "切歌", "停止", "音量", "播放模式", "jukebox", "music", "song", "play", "next", "stop", "volume", "mode"]
version = "0.1.0"
type = "plugin"
entry = "plugin.plugins.jukebox_controller:JukeboxControllerPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = false

# Permissions this plugin needs from the user (see docs/plugins/plugin-toml.md).
[permissions.require."plugin_sdk.main_agent.messages:push"]
reason = { zh-CN = "让 N.E.K.O 的点歌台播放、切换或停止歌曲。", zh-TW = "讓 N.E.K.O 的點歌台播放、切換或停止歌曲。", en = "Have N.E.K.O's jukebox play, skip or stop songs.", ja = "N.E.K.O のジュークボックスで曲を再生・スキップ・停止します。", ko = "N.E.K.O의 주크박스에서 곡을 재생하거나 넘기거나 멈춥니다.", ru = "Включать, переключать и останавливать песни в музыкальном автомате N.E.K.O.", es = "Hacer que la rocola de N.E.K.O reproduzca, salte o detenga canciones.", pt = "Fazer a jukebox do N.E.K.O tocar, pular ou parar músicas." }
