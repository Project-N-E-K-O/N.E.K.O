[plugin]
id = "app_launcher"
name = "应用启动器"
description = "管理软件快捷方式和可执行文件路径，让猫娘可以帮主人打开指定软件，支持开机自启功能。"
short_description = "Register app shortcuts and executables so Neko can launch them for you, with autostart support."
keywords = [
    "应用", "软件", "启动", "打开", "快捷方式", "launcher", "app", "software",
    "program", "exe", "shortcut", "open", "launch", "开机自启", "autostart",
    "自動起動", "アプリ", "ソフト", "프로그램", "앱", "приложение", "программа"
]
version = "1.3.0"
type = "plugin"
entry = "plugin.plugins.app_launcher:AppLauncherPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.store]
enabled = true

[plugin_runtime]
enabled = true
auto_start = false

[plugin.ui]
enabled = true

[plugin.i18n]
default_locale = "zh-CN"
locales = ["zh-CN", "zh-TW", "en", "ja", "ko", "ru", "pt", "es"]

# Permissions this plugin needs from the user (see docs/plugins/plugin-toml.md).
[permissions.require."system.process:spawn"]
reason = { zh-CN = "打开你添加到启动器里的软件和程序；你要求时，也可以把它们设为开机自启（仅 Windows）。", zh-TW = "開啟你加入啟動器的軟體和程式；你要求時，也可以把它們設為開機自動啟動（僅限 Windows）。", en = "Open the apps and programs you add to the launcher, and, when you ask, set them to start when you sign in (Windows only).", ja = "ランチャーに登録したアプリやプログラムを起動します。指示があれば、サインイン時に自動で起動するよう設定することもできます（Windows のみ）。", ko = "런처에 추가한 앱과 프로그램을 실행합니다. 요청하면 로그인할 때 자동으로 실행되도록 설정할 수도 있습니다(Windows 전용).", ru = "Запускать приложения и программы, которые вы добавили в лаунчер, а по вашей просьбе — включать их автозапуск при входе в систему (только Windows).", es = "Abrir las aplicaciones y programas que añadas al lanzador y, si lo pides, hacer que se inicien al iniciar sesión (solo Windows).", pt = "Abrir os aplicativos e programas que você adicionar ao lançador e, se você pedir, fazê-los iniciar quando você entrar no sistema (somente Windows)." }

[permissions.require."system.env:read"]
reason = { zh-CN = "展开你填的路径里的环境变量（例如 %APPDATA%）；启动的程序会继承这些环境变量。", zh-TW = "展開你填的路徑裡的環境變數（例如 %APPDATA%）；啟動的程式會繼承這些環境變數。", en = "Expand environment variables in the paths you enter (such as %APPDATA%); the programs it opens inherit these variables.", ja = "入力したパスに含まれる環境変数（%APPDATA% など）を展開します。起動したプログラムはこれらの環境変数を引き継ぎます。", ko = "입력한 경로의 환경 변수(예: %APPDATA%)를 펼칩니다. 실행한 프로그램은 이 환경 변수를 물려받습니다.", ru = "Подставлять переменные окружения в указанные вами пути (например, %APPDATA%); запущенные программы наследуют эти переменные.", es = "Expandir las variables de entorno de las rutas que escribas (como %APPDATA%); los programas que abre heredan estas variables.", pt = "Expandir variáveis de ambiente nos caminhos que você informar (como %APPDATA%); os programas abertos herdam essas variáveis." }
