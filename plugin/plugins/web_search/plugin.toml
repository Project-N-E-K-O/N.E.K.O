[plugin]
name = "网络搜索"
description = "联网搜索。优先使用 AnySearch，并按用户 IP 选择中国或国际区域；失败时回退百度或 DuckDuckGo。"
short_description = "AnySearch-first web search with GeoIP region routing and Baidu/DuckDuckGo fallback."
keywords = ["搜索", "search", "AnySearch", "百度", "duckduckgo", "搜一", "查[一找]", "google", "검색", "찾아", "検索", "調べ", "探し", "поиск", "искать", "найти"]
version = "0.1.6"
id = "web_search"
entry = "plugin.plugins.web_search:WebSearchPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[search]
# auto: use AnySearch first. GeoIP CN -> zone=cn; known non-CN -> zone=intl;
# detection failure omits zone. If AnySearch fails, CN/unknown falls back to
# Baidu and known non-CN falls back to DuckDuckGo.
# Set anysearch, baidu or duckduckgo to force that source without cross-engine
# fallback. An entry-level explicit backend also disables cross-engine fallback.
backend = "auto"
# Optional. Without a key, AnySearch uses anonymous access with lower limits.
anysearch_api_key = ""
max_results = 8
timeout_seconds = 15
# Complete retries and fallback before the host's 30-second entry watchdog.
total_timeout_seconds = 25
# Absorb repeated/high-burst calls instead of forwarding them to search engines.
cache_ttl_seconds = 120
stale_ttl_seconds = 600
cache_entries = 128
# Serialize requests per engine and pause after rate limits/challenge pages.
min_interval_seconds = 0.75
# Baidu ties challenges to IP/session bursts. Keep its anonymous cookie jar
# across commands/restarts and leave a wider gap between distinct queries.
baidu_min_interval_seconds = 15
# DuckDuckGo is more sensitive to automated bursts than Baidu.
duckduckgo_min_interval_seconds = 3
cooldown_seconds = 60
# Repeated DuckDuckGo blocks back off: 5m, 10m, 20m... up to 1h.
duckduckgo_cooldown_seconds = 300
duckduckgo_max_cooldown_seconds = 3600
queue_wait_seconds = 2
# Retry transient network/5xx failures once; never retry 202/429.
retry_attempts = 2
retry_base_delay_seconds = 0.5
duckduckgo_retry_base_delay_seconds = 2
# HTML and Lite share an upstream; never switch endpoints in the same burst.
duckduckgo_fallback_delay_seconds = 3
