[plugin]
type = "plugin"
id = "netease_music"
name = "网易云匿名点歌"
description = "匿名搜索网易云单曲并播放搜索第一项，可在插件 Hosted UI 中配置登录 Cookie。"
short_description = "匿名搜索网易云歌曲，可使用插件内登录 Cookie 播放。"
version = "0.1.0"
entry = "plugin.plugins.netease_music:NeteaseMusicPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "网易云音乐"
entry = "ui/panel.tsx"
mode = "hosted-tsx"
context = "credentials"
permissions = ["state:read", "action:call"]

[plugin_runtime]
enabled = false
auto_start = false
