[plugin]
type = "plugin"
id = "netease_music"
name = "网易云匿名点歌"
description = "匿名搜索网易云单曲并播放搜索第一项，可在插件 Hosted UI 中配置登录 Cookie。"
short_description = "匿名搜索网易云歌曲，可使用插件内登录 Cookie 播放。"
version = "0.1.0"
entry = "plugin.plugins.netease_music:NeteaseMusicPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "网易云音乐"
entry = "ui/panel.tsx"
mode = "hosted-tsx"
context = "credentials"
permissions = ["state:read", "action:call"]

[plugin_runtime]
enabled = false
auto_start = false

# Permissions this plugin needs from the user (see docs/plugins/plugin-toml.md).
[permissions.require."system.network:connect"]
reason = { zh-CN = "在网易云音乐搜索并获取歌曲。", zh-TW = "在網易雲音樂搜尋並取得歌曲。", en = "Search NetEase Cloud Music and fetch songs.", ja = "NetEase Cloud Music で曲を検索して取得します。", ko = "NetEase Cloud Music에서 곡을 검색하고 가져옵니다.", ru = "Искать и получать песни в NetEase Cloud Music.", es = "Buscar y obtener canciones en NetEase Cloud Music.", pt = "Pesquisar e obter músicas no NetEase Cloud Music." }

[permissions.require."plugin_sdk.main_agent.messages:push"]
reason = { zh-CN = "把找到的歌曲发到对话里播放。", zh-TW = "把找到的歌曲傳到對話裡播放。", en = "Send the song it finds to the chat to play.", ja = "見つけた曲を会話に送って再生します。", ko = "찾은 곡을 대화로 보내 재생합니다.", ru = "Отправлять найденную песню в чат для воспроизведения.", es = "Enviar al chat la canción encontrada para reproducirla.", pt = "Enviar ao chat a música encontrada para tocar." }
