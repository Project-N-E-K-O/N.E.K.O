[pytest]
asyncio_mode = auto
# Seed 与根 pytest.ini 保持一致——这个目录不继承根 ini，漏掉就等于让 plugin 闸门
# 每次跑一个随机顺序。为什么钉死而不是随机，见根 pytest.ini 里的说明。
addopts = -p no:anyio --randomly-seed=20260731
cache_dir = ../../.pytest-cache-plugin
# Per-test limit, same values as the root pytest.ini (this directory does not
# inherit it): without it one hung test holds the whole CI job until the job
# ceiling. The slowest plugin test on CI takes about 7 s. pytest-timeout uses
# the signal method on Linux and the thread method on Windows, where hitting
# the limit ends the xdist worker; xdist reports that test as failed. The
# Windows CI job turns worker restarts off, see plugin-tests.yml for why.
# The faulthandler dump 20 s earlier prints every thread's stack,
# which pytest-timeout's own dump does not get out of an xdist worker.
# A test that needs longer gets @pytest.mark.timeout(seconds).
timeout = 300
faulthandler_timeout = 280
testpaths =
    unit/server
    unit/sdk
    integration
markers =
    plugin_unit: plugin-level pure unit tests
    plugin_integration: plugin server integration tests (ASGI/httpx)
    plugin_e2e: plugin UI/browser end-to-end tests (opt-in)
    host_model_autobind: opt out of the default auto-bind thread suppression to test the install hook
