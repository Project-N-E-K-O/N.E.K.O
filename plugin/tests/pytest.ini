[pytest]
asyncio_mode = auto
# Seed 与根 pytest.ini 保持一致——这个目录不继承根 ini，漏掉就等于让 plugin 闸门
# 每次跑一个随机顺序。为什么钉死而不是随机，见根 pytest.ini 里的说明。
addopts = -p no:anyio --basetemp=../.pytest-run --randomly-seed=20260731
cache_dir = ../../.pytest-cache-plugin
testpaths =
    unit/server
    unit/sdk
    integration
    e2e
markers =
    plugin_unit: plugin-level pure unit tests
    plugin_integration: plugin server integration tests (ASGI/httpx)
    plugin_e2e: plugin UI/browser end-to-end tests (opt-in)
